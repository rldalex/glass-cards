<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Card - Glass Cards</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --radius-xl: 22px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --radius-full: 9999px;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-std: cubic-bezier(0.4, 0, 0.2, 1);
      --t-slow: 1.2s var(--ease-std);
      --t-med: 0.4s var(--ease-std);
      --t-fast: 0.2s var(--ease-std);
      --t-layout: 0.35s var(--ease-out);

      --c-success: #4ade80;
      --c-alert: #f87171;
      --c-warning: #fbbf24;
      --c-info: #60a5fa;
      --c-accent: #818cf8;
      --c-purple: #a78bfa;

      --t1: rgba(255, 255, 255, 0.88);
      --t2: rgba(255, 255, 255, 0.60);
      --t3: rgba(255, 255, 255, 0.45);
      --t4: rgba(255, 255, 255, 0.25);

      --s1: rgba(255, 255, 255, 0.04);
      --s2: rgba(255, 255, 255, 0.06);
      --s3: rgba(255, 255, 255, 0.08);
      --s4: rgba(255, 255, 255, 0.12);

      --b1: rgba(255, 255, 255, 0.06);
      --b2: rgba(255, 255, 255, 0.08);
      --b3: rgba(255, 255, 255, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 16px 100px;
      transition: background var(--t-slow);
    }

    /* ==================== AMBIENT BACKGROUND ==================== */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      transition: background var(--t-slow);
    }

    .ambient-bg::before,
    .ambient-bg::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      transition: background var(--t-slow);
    }

    .ambient-bg::before {
      width: 600px;
      height: 600px;
      top: -200px;
      right: -100px;
    }

    .ambient-bg::after {
      width: 500px;
      height: 500px;
      bottom: -150px;
      left: -100px;
    }

    body[data-time="morning"] { background: #0f1923; }
    body[data-time="morning"] .ambient-bg::before { background: #1a6b8a; }
    body[data-time="morning"] .ambient-bg::after { background: #2d8a6e; }

    body[data-time="day"] { background: #111827; }
    body[data-time="day"] .ambient-bg::before { background: #3b6fa0; }
    body[data-time="day"] .ambient-bg::after { background: #4a90a0; }

    body[data-time="evening"] { background: #1a1118; }
    body[data-time="evening"] .ambient-bg::before { background: #8a4a2d; }
    body[data-time="evening"] .ambient-bg::after { background: #6b3a5a; }

    body[data-time="night"] { background: #0a0e1a; }
    body[data-time="night"] .ambient-bg::before { background: #1a2040; }
    body[data-time="night"] .ambient-bg::after { background: #2a1a3a; }

    /* ==================== GLASS BASE ==================== */
    .glass {
      position: relative;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0.06) 100%);
      backdrop-filter: blur(40px) saturate(1.4);
      -webkit-backdrop-filter: blur(40px) saturate(1.4);
      box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.1), 0 8px 32px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.15);
      border: 1px solid var(--b2);
      transition: border-color var(--t-fast);
    }

    .glass:hover {
      border-color: var(--b3);
    }

    /* ==================== CALENDAR CARD ==================== */
    .calendar-card {
      width: 360px;
      max-width: 100%;
      overflow: hidden;
    }

    .card-inner {
      position: relative;
      z-index: 1;
    }

    /* ==================== LAYOUT ==================== */
    .dashboard-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 360px;
      max-width: 100%;
    }

    @keyframes float-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .calendar-card {
      animation: float-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.06s both;
    }

    .calendar-card:nth-child(2) { animation-delay: 0.12s; }
    .calendar-card:nth-child(3) { animation-delay: 0.18s; }
    .calendar-card:nth-child(4) { animation-delay: 0.24s; }

    /* ==================== V4 — COMPACT BAR + FOLD ==================== */

    /* ── Compact bar ── */
    .v4-compact {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.75rem 0.875rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      min-height: 3rem;
      transition: background var(--t-fast);
      border-radius: var(--radius-xl);
    }

    .v4-compact:active {
      background: rgba(255, 255, 255, 0.03);
    }

    .v4-compact-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .v4-compact-icon {
      width: 0.875rem;
      height: 0.875rem;
      color: var(--c-accent);
      flex-shrink: 0;
    }

    .v4-compact-date {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--t1);
      white-space: nowrap;
      line-height: 1rem;
    }

    .v4-compact-count {
      font-size: 0.625rem;
      font-weight: 700;
      color: var(--c-accent);
      background: rgba(129, 140, 248, 0.12);
      border: 1px solid rgba(129, 140, 248, 0.2);
      border-radius: var(--radius-full);
      padding: 0 0.375rem;
      min-width: 1.125rem;
      height: 1.125rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      box-sizing: border-box;
    }

    /* Thin separator between left info and ticker */
    .v4-compact-sep {
      width: 0.0625rem;
      height: 0.75rem;
      background: var(--b2);
      flex-shrink: 0;
    }

    /* ── Roll-up ticker ── */
    .v4-ticker-wrap {
      flex: 1;
      min-width: 0;
      height: 1rem;
      position: relative;
      overflow: hidden;
    }

    .v4-ticker-item {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      position: absolute;
      left: 0; right: 0;
      top: 0; bottom: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .v4-ticker-item.below  { transform: translateY(100%); opacity: 0; }
    .v4-ticker-item.active { transform: translateY(0);    opacity: 1; }
    .v4-ticker-item.above  { transform: translateY(-100%); opacity: 0; }
    .v4-ticker-item.hidden { display: none; }

    .v4-ticker-dot {
      width: 0.3125rem;
      height: 0.3125rem;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .v4-ticker-text {
      font-size: var(--fz-base, 11px);
      font-weight: 500;
      color: var(--t2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1rem;
    }

    .v4-ticker-time {
      font-size: var(--fz-base, 11px);
      font-weight: 500;
      color: var(--t3);
      flex-shrink: 0;
      line-height: 1rem;
    }

    .v4-ticker-item.now .v4-ticker-text {
      color: var(--t1);
      font-weight: 600;
    }

    .v4-ticker-item.now .v4-ticker-time {
      color: var(--c-accent);
    }

    /* ── Toggle button ── */
    .v4-compact-toggle {
      width: 1.375rem;
      height: 1.375rem;
      border-radius: var(--radius-sm);
      background: var(--s2);
      border: 1px solid var(--b1);
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--t3);
      flex-shrink: 0;
      transition: background var(--t-fast), border-color var(--t-fast);
      position: relative;
    }

    .v4-compact-toggle:hover {
      background: var(--s3);
      border-color: var(--b2);
    }

    .v4-compact-toggle::before {
      content: '';
      position: absolute;
      inset: -0.6875rem;
    }

    .v4-compact-toggle:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.25);
      outline-offset: -2px;
    }

    .v4-compact-toggle svg {
      width: 0.75rem;
      height: 0.75rem;
      transition: transform var(--t-fast);
    }

    .calendar-card.open .v4-compact-toggle svg {
      transform: rotate(180deg);
    }

    /* ── Fold ── */
    .v4-fold {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--t-layout);
    }

    .calendar-card.open .v4-fold {
      grid-template-rows: 1fr;
    }

    .v4-fold-inner {
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s ease 0s;
    }

    .calendar-card.open .v4-fold-inner {
      opacity: 1;
      transition: opacity 0.2s ease 0.1s;
    }

    .v4-fold-sep {
      height: 0.0625rem;
      margin: 0 0.75rem 0.625rem;
      background: linear-gradient(90deg, transparent, rgba(129, 140, 248, 0.15), transparent);
    }

    .v4-fold .card-inner {
      padding: 0 0.875rem 0.875rem;
    }

    /* ── Week strip (forward-looking) ── */
    .v4-week-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 0.75rem;
      padding: 0.375rem 0.25rem;
      border-radius: var(--radius-md);
      background: var(--s1);
      border: 1px solid var(--b1);
    }

    .v4-week-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 0.375rem 0;
      min-height: 2.75rem;
      border-radius: var(--radius-sm);
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      font-family: inherit;
      transition: background var(--t-fast);
    }

    .v4-week-day:hover { background: var(--s3); }
    .v4-week-day:active { transform: scale(0.98); }

    .v4-week-day:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.25);
      outline-offset: -2px;
    }

    .v4-week-day-label {
      font-size: 0.625rem;
      font-weight: 600;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1;
    }

    .v4-week-day-num {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--t2);
      line-height: 1;
      width: 1.625rem;
      height: 1.625rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background var(--t-fast), color var(--t-fast);
    }

    .v4-week-day.today .v4-week-day-num {
      background: rgba(129, 140, 248, 0.2);
      color: var(--c-accent);
      font-weight: 700;
    }

    .v4-week-day-dots { display: flex; gap: 3px; min-height: 4px; }
    .v4-week-dot { width: 4px; height: 4px; border-radius: 50%; }

    .v4-fold-separator {
      height: 0.0625rem;
      background: var(--b1);
      margin-bottom: 0.5rem;
    }

    .v4-cal-legend {
      display: flex;
      gap: 0.625rem;
      padding: 0.5rem 0 0;
      flex-wrap: wrap;
    }

    .v4-cal-legend-item { display: flex; align-items: center; gap: 5px; }
    .v4-cal-legend-dot { width: 6px; height: 6px; border-radius: 50%; }
    .v4-cal-legend-label { font-size: 0.625rem; font-weight: 500; color: var(--t3); }

    /* ── Event list (in fold) ── */
    .v4-event-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 0.5rem; }

    .v4-event-row {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.625rem;
      min-height: 2.75rem;
      border-radius: var(--radius-sm);
      background: none;
      border: 1px solid transparent;
      cursor: pointer;
      outline: none;
      font-family: inherit;
      text-align: left;
      width: 100%;
      transition: background var(--t-fast);
    }

    .v4-event-row:hover { background: var(--s2); }
    .v4-event-row:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.25); outline-offset: -2px; }
    .v4-event-row:active { transform: scale(0.98); }

    .v4-event-color-bar {
      width: 3px;
      height: 1.75rem;
      border-radius: 2px;
      flex-shrink: 0;
      transition: box-shadow var(--t-fast);
    }

    .v4-event-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

    .v4-event-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--t2);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .v4-event-time { font-size: 0.6875rem; font-weight: 400; color: var(--t3); line-height: 1.2; }

    .v4-event-allday {
      font-size: 0.5625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--t3);
      padding: 2px 0.5rem;
      border-radius: var(--radius-full);
      background: var(--s1);
      border: 1px solid var(--b1);
      flex-shrink: 0;
    }

    /* Now event */
    .v4-event-row.now { background: rgba(129, 140, 248, 0.04); border-color: rgba(129, 140, 248, 0.08); }
    .v4-event-row.now .v4-event-title { color: var(--t1); }
    .v4-event-row.now .v4-event-time { color: var(--c-accent); font-weight: 500; }
    .v4-event-row.now .v4-event-color-bar { box-shadow: 0 0 8px currentColor; }

    /* Empty state */
    .v4-event-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 1rem 0 0.5rem; }
    .v4-event-empty-icon { width: 1.5rem; height: 1.5rem; color: var(--t4); margin-bottom: 2px; }
    .v4-event-empty-title { font-size: 0.75rem; font-weight: 600; color: var(--t3); }
    .v4-event-empty-sub { font-size: 0.625rem; font-weight: 400; color: var(--t4); }

    /* ── Empty ticker ── */
    .v4-ticker-empty {
      position: relative;
      height: 1.125rem;
      display: flex;
      align-items: center;
      font-size: var(--fz-base, 11px);
      font-weight: 500;
      color: var(--t4);
      font-style: italic;
    }

    /* ==================== CONTROLS ==================== */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 100;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 92vw;
    }

    .controls-group {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .controls-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.3);
      margin-right: 2px;
    }

    .control-btn {
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.6);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.95);
    }

    .control-btn:active {
      transform: scale(0.96);
    }

    .control-btn.active {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.05ms !important;
      }
    }
  </style>
</head>

<body data-time="evening">

  <div class="ambient-bg"></div>

  <div class="dashboard-column">

    <div class="glass calendar-card" id="card-v4">
      <!-- ── Compact bar (visible when fold closed) ── -->
      <div class="v4-compact" id="v4-compact">
        <div class="v4-compact-left">
          <svg class="v4-compact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span class="v4-compact-date" id="v4-compact-date"></span>
          <span class="v4-compact-count" id="v4-compact-count"></span>
        </div>
        <div class="v4-compact-sep"></div>
        <div class="v4-ticker-wrap">
          <div class="v4-ticker" id="v4-ticker" aria-live="polite"></div>
        </div>
        <button class="v4-compact-toggle" id="v4-toggle-btn" aria-label="Ouvrir le calendrier">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      </div>

      <!-- ── Fold: full calendar (hidden by default) ── -->
      <div class="v4-fold" id="v4-fold">
        <div class="v4-fold-inner">
          <div class="v4-fold-sep"></div>
          <div class="card-inner">
            <div class="v4-week-strip" id="v4-week-strip"></div>
            <div class="v4-fold-separator"></div>
            <div class="v4-event-list" id="v4-event-list"></div>
            <div class="v4-cal-legend" id="v4-legend"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="controls">
    <div class="controls-group">
      <span class="controls-label">Ambiance</span>
      <button class="control-btn" data-time="morning" onclick="setTime('morning', this)">Matin</button>
      <button class="control-btn" data-time="day" onclick="setTime('day', this)">Jour</button>
      <button class="control-btn active" data-time="evening" onclick="setTime('evening', this)">Soir</button>
      <button class="control-btn" data-time="night" onclick="setTime('night', this)">Nuit</button>
    </div>
    <div class="controls-group">
      <span class="controls-label">Vue</span>
      <button class="control-btn active" data-view="busy" onclick="setView('busy', this)">Chargé</button>
      <button class="control-btn" data-view="light" onclick="setView('light', this)">Léger</button>
      <button class="control-btn" data-view="empty" onclick="setView('empty', this)">Vide</button>
    </div>
  </div>

  <script>
    /* ── CALENDAR COLORS (mapped to HA calendar entities) ── */
    var CAL_COLORS = {
      perso: { color: '#818cf8', label: 'Personnel' },
      travail: { color: '#60a5fa', label: 'Travail' },
      famille: { color: '#f472b6', label: 'Famille' },
      taches: { color: '#fbbf24', label: 'Tâches' },
      anniversaires: { color: '#4ade80', label: 'Anniversaires' }
    };

    /* ── MOCK DATA ── */
    var EVENTS_BUSY = [
      { title: 'Daily standup', time: '09:00 - 09:30', cal: 'travail', now: false },
      { title: 'Dentiste Luca', time: '10:15 - 11:00', cal: 'famille', now: true },
      { title: 'Revue sprint Q2', time: '14:00 - 15:30', cal: 'travail', now: false },
      { title: 'Courses Migros', time: '17:00', cal: 'taches', now: false },
      { title: 'Anniversaire Maman', time: null, cal: 'anniversaires', allday: true, now: false },
      { title: 'Yoga', time: '18:30 - 19:30', cal: 'perso', now: false },
      { title: 'Appel Marc', time: '20:00', cal: 'perso', now: false }
    ];

    var EVENTS_LIGHT = [
      { title: 'Brunch dimanche', time: '11:00 - 13:00', cal: 'famille', now: false },
      { title: 'Lessive', time: null, cal: 'taches', allday: true, now: false }
    ];

    var EVENTS_EMPTY = [];

    var currentView = 'busy';

    /* ══════════════════ HELPERS ══════════════════ */
    function isUpcoming(timeStr) {
      var parts = timeStr.split(' - ');
      var endTime = parts.length > 1 ? parts[1] : parts[0];
      var hm = endTime.split(':');
      var now = new Date();
      var eventEnd = new Date();
      eventEnd.setHours(parseInt(hm[0], 10), parseInt(hm[1], 10), 0);
      return eventEnd > now;
    }

    /* ══════════════════ V4 — COMPACT BAR + TICKER ══════════════════ */
    function renderV4Compact(events) {
      var now = new Date();
      var jours = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
      var mois = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
      document.getElementById('v4-compact-date').textContent = jours[now.getDay()] + ' ' + now.getDate() + ' ' + mois[now.getMonth()];

      var ticker = document.getElementById('v4-ticker');
      while (ticker.firstChild) ticker.removeChild(ticker.firstChild);

      /* Stop previous timer */
      if (window._tickerTimer) clearInterval(window._tickerTimer);

      /* Filter past events from ticker */
      var tickerEvents = events.filter(function(e) {
        return e.now || e.allday || !e.time || isUpcoming(e.time);
      });

      document.getElementById('v4-compact-count').textContent = tickerEvents.length;

      if (tickerEvents.length === 0) {
        var empty = document.createElement('span');
        empty.className = 'v4-ticker-empty';
        empty.textContent = 'Aucun événement';
        ticker.appendChild(empty);
        return;
      }

      /* Build all items */
      var items = [];
      for (var i = 0; i < tickerEvents.length; i++) {
        var ev = tickerEvents[i];
        var item = document.createElement('div');
        item.className = 'v4-ticker-item hidden';
        if (ev.now) item.classList.add('now');

        var dot = document.createElement('span');
        dot.className = 'v4-ticker-dot';
        dot.style.background = CAL_COLORS[ev.cal] ? CAL_COLORS[ev.cal].color : 'var(--t4)';

        var text = document.createElement('span');
        text.className = 'v4-ticker-text';
        text.textContent = ev.title;

        var time = document.createElement('span');
        time.className = 'v4-ticker-time';
        time.textContent = ev.time ? ev.time.split(' - ')[0] : 'Journée';

        item.appendChild(dot);
        item.appendChild(text);
        item.appendChild(time);
        ticker.appendChild(item);
        items.push(item);
      }

      /* Show first item immediately */
      var current = 0;
      items[0].className = items[0].className.replace('hidden', 'active');

      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (tickerEvents.length === 1 || prefersReduced) return;

      /* Roll-up cycle: every 3.5s, exit current upward + enter next from below */
      window._tickerTimer = setInterval(function() {
        var prev = current;
        current = (current + 1) % items.length;

        /* Current exits upward */
        items[prev].className = items[prev].className.replace('active', 'above');

        /* Next enters from below — first position it below without transition */
        items[current].classList.remove('hidden', 'above');
        items[current].classList.add('below');
        /* Force reflow so the browser registers the 'below' position */
        void items[current].offsetHeight;
        /* Then animate to active */
        items[current].classList.remove('below');
        items[current].classList.add('active');

        /* After transition, hide the exited item */
        setTimeout(function() {
          items[prev].classList.remove('above');
          items[prev].classList.add('hidden');
        }, 500);
      }, 3500);
    }

    /* ══════════════════ V4 — WEEK STRIP ══════════════════ */
    function renderWeekStrip(events) {
      var strip = document.getElementById('v4-week-strip');
      while (strip.firstChild) strip.removeChild(strip.firstChild);

      var now = new Date();
      var jours = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];

      var dotsByOffset = {};
      dotsByOffset[0] = events.map(function(e) { return e.cal; }).slice(0, 3);
      dotsByOffset[1] = ['travail'];
      dotsByOffset[3] = ['famille', 'perso'];

      for (var i = 0; i < 7; i++) {
        var d = new Date(now);
        d.setDate(now.getDate() + i);

        var btn = document.createElement('button');
        btn.className = 'v4-week-day';
        if (i === 0) btn.classList.add('today');

        var label = document.createElement('span');
        label.className = 'v4-week-day-label';
        label.textContent = jours[d.getDay()];

        var num = document.createElement('span');
        num.className = 'v4-week-day-num';
        num.textContent = d.getDate();

        var dots = document.createElement('div');
        dots.className = 'v4-week-day-dots';

        if (dotsByOffset[i]) {
          var dayDots = dotsByOffset[i].slice(0, 3);
          for (var j = 0; j < dayDots.length; j++) {
            var dot = document.createElement('span');
            dot.className = 'v4-week-dot';
            dot.style.background = CAL_COLORS[dayDots[j]] ? CAL_COLORS[dayDots[j]].color : 'var(--t4)';
            dots.appendChild(dot);
          }
        }

        btn.appendChild(label);
        btn.appendChild(num);
        btn.appendChild(dots);
        strip.appendChild(btn);
      }
    }

    /* ══════════════════ V4 — EVENT LIST ══════════════════ */
    function renderEventList(events) {
      var list = document.getElementById('v4-event-list');
      while (list.firstChild) list.removeChild(list.firstChild);

      var upcoming = events.filter(function(e) {
        return e.now || e.allday || !e.time || isUpcoming(e.time);
      });

      if (upcoming.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'v4-event-empty';

        var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        icon.setAttribute('class', 'v4-event-empty-icon');
        icon.setAttribute('viewBox', '0 0 24 24');
        icon.setAttribute('fill', 'none');
        icon.setAttribute('stroke', 'currentColor');
        icon.setAttribute('stroke-width', '1.5');
        icon.setAttribute('stroke-linecap', 'round');
        icon.setAttribute('stroke-linejoin', 'round');
        var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', '3'); rect.setAttribute('y', '4');
        rect.setAttribute('width', '18'); rect.setAttribute('height', '18');
        rect.setAttribute('rx', '2');
        var l1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l1.setAttribute('x1', '16'); l1.setAttribute('y1', '2');
        l1.setAttribute('x2', '16'); l1.setAttribute('y2', '6');
        var l2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l2.setAttribute('x1', '8'); l2.setAttribute('y1', '2');
        l2.setAttribute('x2', '8'); l2.setAttribute('y2', '6');
        var l3 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l3.setAttribute('x1', '3'); l3.setAttribute('y1', '10');
        l3.setAttribute('x2', '21'); l3.setAttribute('y2', '10');
        icon.appendChild(rect); icon.appendChild(l1); icon.appendChild(l2); icon.appendChild(l3);

        var title = document.createElement('span');
        title.className = 'v4-event-empty-title';
        title.textContent = 'Rien de pr\u00e9vu';

        var sub = document.createElement('span');
        sub.className = 'v4-event-empty-sub';
        sub.textContent = 'Profitez de votre journ\u00e9e';

        empty.appendChild(icon); empty.appendChild(title); empty.appendChild(sub);
        list.appendChild(empty);
        return;
      }

      for (var i = 0; i < upcoming.length; i++) {
        var ev = upcoming[i];
        var calColor = CAL_COLORS[ev.cal] ? CAL_COLORS[ev.cal].color : '#818cf8';

        var row = document.createElement('button');
        row.className = 'v4-event-row';
        if (ev.now) row.classList.add('now');
        row.setAttribute('aria-label', ev.title + (ev.time ? ', ' + ev.time : ', toute la journ\u00e9e') + (ev.now ? ', en cours' : ''));

        var bar = document.createElement('div');
        bar.className = 'v4-event-color-bar';
        bar.style.background = calColor;
        if (ev.now) bar.style.color = calColor;

        var content = document.createElement('div');
        content.className = 'v4-event-content';

        var titleEl = document.createElement('span');
        titleEl.className = 'v4-event-title';
        titleEl.textContent = ev.title;

        var timeEl = document.createElement('span');
        timeEl.className = 'v4-event-time';
        if (ev.now && ev.time) {
          timeEl.textContent = ev.time + ' \u00b7 En cours';
        } else if (ev.time) {
          timeEl.textContent = ev.time;
        } else {
          timeEl.textContent = 'Toute la journ\u00e9e';
        }

        content.appendChild(titleEl); content.appendChild(timeEl);
        row.appendChild(bar); row.appendChild(content);

        if (ev.allday) {
          var badge = document.createElement('span');
          badge.className = 'v4-event-allday';
          badge.textContent = 'Journ\u00e9e';
          row.appendChild(badge);
        }

        list.appendChild(row);
      }
    }

    /* ══════════════════ V4 — LEGEND ══════════════════ */
    function renderLegend() {
      var legend = document.getElementById('v4-legend');
      while (legend.firstChild) legend.removeChild(legend.firstChild);

      var keys = Object.keys(CAL_COLORS);
      for (var i = 0; i < keys.length; i++) {
        var cal = CAL_COLORS[keys[i]];
        var item = document.createElement('div');
        item.className = 'v4-cal-legend-item';

        var dot = document.createElement('span');
        dot.className = 'v4-cal-legend-dot';
        dot.style.background = cal.color;

        var label = document.createElement('span');
        label.className = 'v4-cal-legend-label';
        label.textContent = cal.label;

        item.appendChild(dot); item.appendChild(label);
        legend.appendChild(item);
      }
    }

    /* ══════════════════ V4 — TOGGLE ══════════════════ */
    var v4Open = false;
    function toggleV4() {
      v4Open = !v4Open;
      document.getElementById('card-v4').classList.toggle('open', v4Open);
    }
    document.getElementById('v4-compact').addEventListener('click', function(e) {
      if (!e.target.closest('.v4-compact-toggle')) toggleV4();
    });
    document.getElementById('v4-toggle-btn').addEventListener('click', function(e) {
      e.stopPropagation();
      toggleV4();
    });

    /* ══════════════════ RENDER ALL ══════════════════ */
    function renderAll(events) {
      renderV4Compact(events);
      renderWeekStrip(events);
      renderEventList(events);
      renderLegend();
    }

    /* ── CONTROLS ── */
    function setTime(t, btn) {
      document.body.setAttribute('data-time', t);
      document.querySelectorAll('[data-time]').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    }

    function setView(view, btn) {
      currentView = view;
      document.querySelectorAll('[data-view]').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var events = view === 'busy' ? EVENTS_BUSY : view === 'light' ? EVENTS_LIGHT : EVENTS_EMPTY;
      renderAll(events);
    }

    /* ── INIT ── */
    renderAll(EVENTS_BUSY);
  </script>
