<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Cover Card — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
<style>
  :root {
    --radius-xl: 22px;
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 8px;
    --radius-full: 9999px;

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-std: cubic-bezier(0.4, 0, 0.2, 1);
    --t-slow: 1.2s var(--ease-std);
    --t-med: 0.4s var(--ease-std);
    --t-fast: 0.2s var(--ease-std);
    --t-layout: 0.35s var(--ease-out);

    --c-success: #4ade80;
    --c-alert: #f87171;
    --c-warning: #fbbf24;
    --c-info: #60a5fa;
    --c-accent: #818cf8;

    --t1: rgba(255, 255, 255, 0.88);
    --t2: rgba(255, 255, 255, 0.60);
    --t3: rgba(255, 255, 255, 0.45);
    --t4: rgba(255, 255, 255, 0.25);

    --s1: rgba(255, 255, 255, 0.04);
    --s2: rgba(255, 255, 255, 0.06);
    --s3: rgba(255, 255, 255, 0.08);
    --s4: rgba(255, 255, 255, 0.12);

    --b1: rgba(255, 255, 255, 0.06);
    --b2: rgba(255, 255, 255, 0.08);
    --b3: rgba(255, 255, 255, 0.15);

    --cv-color: #a78bfa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #1a1118;
    color: var(--t1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 120px;
    gap: 12px;
    transition: background var(--t-slow);
  }

  /* ── Ambient ── */
  .ambient-bg { position: fixed; inset: 0; z-index: -1; transition: all var(--t-slow); }
  .ambient-bg::before, .ambient-bg::after {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(120px); opacity: 0.4; transition: all var(--t-slow);
  }
  .ambient-bg::before { width: 600px; height: 600px; top: -200px; right: -100px; }
  .ambient-bg::after { width: 500px; height: 500px; bottom: -150px; left: -100px; }

  body[data-time="morning"] { background: #0f1923; }
  body[data-time="morning"] .ambient-bg::before { background: #1a6b8a; }
  body[data-time="morning"] .ambient-bg::after { background: #2d8a6e; }
  body[data-time="day"] { background: #111827; }
  body[data-time="day"] .ambient-bg::before { background: #3b6fa0; }
  body[data-time="day"] .ambient-bg::after { background: #4a90a0; }
  body[data-time="evening"] { background: #1a1118; }
  body[data-time="evening"] .ambient-bg::before { background: #8a4a2d; }
  body[data-time="evening"] .ambient-bg::after { background: #6b3a5a; }
  body[data-time="night"] { background: #0a0e1a; }
  body[data-time="night"] .ambient-bg::before { background: #1a2040; }
  body[data-time="night"] .ambient-bg::after { background: #2a1a3a; }

  /* ── Glass ── */
  .glass {
    position: relative; border-radius: var(--radius-xl);
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0.06) 100%);
    backdrop-filter: blur(40px) saturate(1.4);
    -webkit-backdrop-filter: blur(40px) saturate(1.4);
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.1), 0 8px 32px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.15);
    border: 1px solid var(--b2); transition: border-color var(--t-fast);
  }
  @media (hover: hover) and (pointer: fine) {
    .glass:hover { border-color: rgba(255,255,255,0.13); }
  }

  /* ── Marquee ── */
  @keyframes marquee-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .marquee {
    display: inline-block; white-space: nowrap;
    animation: marquee-scroll 8s linear infinite;
  }

  /* ── Bounce ── */
  @keyframes bounce {
    0% { transform: scale(1); }
    40% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  /* ── Tint ── */
  .tint {
    position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none; z-index: 0;
    transition: opacity var(--t-slow), background var(--t-slow);
  }

  /* ── Card ── */
  .cover-card-wrap {
    width: 500px; max-width: 100%;
    display: flex; flex-direction: column; gap: 6px;
  }
  .cover-card { width: 100%; padding: 2px 14px; }
  .card-inner {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  }

  /* ── Section label ── */
  .section-label {
    font-size: 11px; font-weight: 600; color: var(--t4);
    text-transform: uppercase; letter-spacing: 1px;
    padding: 20px 0 8px; grid-column: 1 / -1;
  }

  /* ── Header ── */
  .cover-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px;
    margin-bottom: 6px; min-height: 22px;
  }
  .cover-header-left { display: flex; align-items: center; gap: 8px; }
  .cover-title {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--t4);
  }
  .cover-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 14px; height: 14px; padding: 0 4px;
    border-radius: var(--radius-full); font-size: 9px; font-weight: 600;
    transition: all var(--t-med);
  }
  .cover-count.some { background: rgba(167,139,250,0.15); color: var(--cv-color, #a78bfa); }
  .cover-count.none { background: var(--s2); color: var(--t3); }
  .cover-count.all  { background: rgba(167,139,250,0.2); color: var(--cv-color, #a78bfa); }

  .cover-header-actions { display: flex; gap: 4px; }
  .header-btn {
    width: 22px; height: 22px; border-radius: var(--radius-sm);
    background: var(--s2); border: 1px solid var(--b2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; outline: none;
    transition: all var(--t-fast); -webkit-tap-highlight-color: transparent;
  }
  .header-btn i { font-size: 14px; color: var(--t3); transition: color var(--t-fast); display: flex; align-items: center; justify-content: center; }
  @media (hover: hover) and (pointer: fine) {
    .header-btn:hover { background: var(--s3); border-color: var(--b3); }
    .header-btn:hover i { color: var(--t1); }
  }
  @media (hover: hover) {
    .header-btn:active { transform: scale(0.96); }
  }
  @media (pointer: coarse) {
    .header-btn:active { animation: bounce 0.3s ease; }
  }
  .header-btn:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: -2px; }

  /* ── Row ── */
  .cv-row {
    display: flex; align-items: center; gap: 10px;
    grid-column: 1 / -1;
    padding: 8px 4px; position: relative;
    border-radius: var(--radius-md);
    transition: background var(--t-fast);
  }
  .cv-row.compact { grid-column: span 1; min-width: 0; overflow: hidden; }
  .cv-row.compact-right { padding-left: 10px; }
  .cv-row.compact-right::before {
    content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 1px;
    background: linear-gradient(180deg, transparent, var(--b2), transparent);
  }
  @media (hover: hover) and (pointer: fine) {
    .cv-row:hover { background: var(--s1); }
  }
  @media (pointer: coarse) {
    .cv-row:active { animation: bounce 0.3s ease; }
  }
  .cv-row:focus-within { background: var(--s1); }

  .cv-expand-btn {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    background: none; border: none; padding: 0;
    font-family: inherit; cursor: pointer; outline: none;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .cv-expand-btn:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: 2px; border-radius: var(--radius-sm); }

  /* Icon box */
  .cv-icon-btn {
    width: 36px; height: 36px; border-radius: var(--radius-md);
    background: var(--s2); border: 1px solid var(--b1);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all var(--t-fast);
    cursor: pointer; padding: 0; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .cv-icon-btn i { font-size: 18px; color: var(--t3); transition: all var(--t-fast); display: flex; align-items: center; justify-content: center; }
  @media (hover: hover) and (pointer: fine) {
    .cv-icon-btn:hover { background: var(--s3); border-color: var(--b2); }
    .cv-icon-btn:hover i { color: var(--t2); }
  }
  @media (hover: hover) {
    .cv-icon-btn:active { transform: scale(0.96); }
  }
  @media (pointer: coarse) {
    .cv-icon-btn:active { animation: bounce 0.3s ease; }
  }
  .cv-icon-btn:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: -2px; }
  .cv-row.open .cv-icon-btn { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.15); }
  .cv-row.open .cv-icon-btn i { color: var(--cv-color, #a78bfa); filter: drop-shadow(0 0 6px rgba(167,139,250,0.4)); }

  /* Info */
  .cv-info { flex: 1; min-width: 0; }
  .cv-name {
    font-size: 13px; font-weight: 600; color: var(--t1); line-height: 1.2;
    overflow: hidden; white-space: nowrap;
  }
  .cv-sub { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .cv-state-text {
    font-size: 10px; font-weight: 500; color: var(--t3);
    transition: color var(--t-med);
  }
  .cv-row.open .cv-state-text { color: rgba(167,139,250,0.6); }

  /* Position */
  .cv-position {
    font-size: 16px; font-weight: 700; color: var(--t3);
    font-variant-numeric: tabular-nums; flex-shrink: 0;
    transition: color var(--t-med);
  }
  .cv-position .unit { font-size: 10px; font-weight: 500; }
  .cv-row.open .cv-position { color: var(--cv-color, #a78bfa); }

  /* Dot */
  .cv-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--t4); transition: all var(--t-med);
  }
  .cv-row.open .cv-dot {
    background: var(--cv-color, #a78bfa); box-shadow: 0 0 8px rgba(167,139,250,0.4);
  }

  /* ── Fold separator ── */
  .fold-sep {
    grid-column: 1 / -1;
    height: 1px; margin: 0 12px; overflow: hidden;
    background: linear-gradient(90deg, transparent, rgba(167,139,250,0.25), transparent);
    opacity: 0; transition: opacity var(--t-layout);
  }
  .fold-sep.visible { opacity: 1; }

  /* ── Fold ── */
  .ctrl-fold {
    grid-column: 1 / -1;
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows var(--t-layout);
  }
  .ctrl-fold.open { grid-template-rows: 1fr; }
  .ctrl-fold-inner {
    overflow: hidden; opacity: 0;
    transition: opacity var(--t-fast);
  }
  .ctrl-fold.open .ctrl-fold-inner { opacity: 1; transition-delay: 0.1s; }

  .ctrl-panel {
    padding: 6px 0 4px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .ctrl-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
    color: rgba(167,139,250,0.6); text-transform: uppercase;
  }

  /* Transport */
  .transport-row {
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .transport-btn {
    width: 44px; height: 44px; border-radius: 14px;
    background: var(--s2); border: 1px solid var(--b2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all var(--t-fast); outline: none; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .transport-btn i { font-size: 22px; color: var(--t2); transition: color var(--t-fast); display: flex; align-items: center; justify-content: center; }
  @media (hover: hover) and (pointer: fine) {
    .transport-btn:hover { background: var(--s3); border-color: var(--b3); }
    .transport-btn:hover i { color: var(--t1); }
  }
  @media (hover: hover) {
    .transport-btn:active { transform: scale(0.96); }
  }
  @media (pointer: coarse) {
    .transport-btn:active { animation: bounce 0.3s ease; }
  }
  .transport-btn:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: -2px; }
  .transport-btn.accent { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.15); }
  .transport-btn.accent i { color: var(--cv-color, #a78bfa); }

  /* Slider */
  .slider-wrap { display: flex; align-items: center; gap: 8px; }
  .slider-icon {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; flex-shrink: 0;
  }
  .slider-icon i { font-size: 18px; color: var(--t3); display: flex; align-items: center; justify-content: center; }
  .slider {
    position: relative; flex: 1; height: 36px;
    border-radius: var(--radius-lg); background: var(--s1);
    border: 1px solid var(--b1); overflow: hidden; cursor: pointer;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .slider-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    border-radius: inherit; pointer-events: none;
    background: linear-gradient(90deg, rgba(167,139,250,0.15), rgba(167,139,250,0.25));
    transition: width 0.05s linear;
  }
  .slider-thumb {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 8px; height: 20px; border-radius: 4px;
    background: rgba(255,255,255,0.7); box-shadow: 0 0 8px rgba(255,255,255,0.2);
    pointer-events: none; transition: left 0.05s linear;
  }
  .slider-val {
    position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
    font-size: 11px; font-weight: 600; color: var(--t3); pointer-events: none;
  }

  /* Presets */
  .preset-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: var(--radius-md);
    border: 1px solid var(--b2); background: var(--s1);
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--t3); cursor: pointer; transition: all var(--t-fast);
    outline: none; -webkit-tap-highlight-color: transparent;
  }
  .chip i { font-size: 14px; display: flex; align-items: center; justify-content: center; }
  @media (hover: hover) and (pointer: fine) {
    .chip:hover { background: var(--s3); color: var(--t2); border-color: var(--b3); }
  }
  .chip:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: -2px; }
  @media (hover: hover) {
    .chip:active { transform: scale(0.96); }
  }
  @media (pointer: coarse) {
    .chip:active { animation: bounce 0.3s ease; }
  }
  .chip.active { border-color: rgba(167,139,250,0.15); background: rgba(167,139,250,0.1); color: var(--cv-color, #a78bfa); }

  .ctrl-sep { height: 1px; background: var(--b1); margin: 2px 0; }

  /* ── Demo ── */
  .controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 10px 16px;
    border-radius: 20px; background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px); border: 1px solid var(--b2);
    z-index: 100; flex-wrap: wrap; justify-content: center; max-width: 92vw;
  }
  .controls-group { display: flex; gap: 5px; align-items: center; }
  .controls-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--t4); margin-right: 2px;
  }
  .demo-btn {
    padding: 6px 12px; border: 1px solid var(--b2);
    border-radius: var(--radius-md); background: var(--s1); color: var(--t3);
    font-family: inherit; font-size: 11px; font-weight: 500;
    cursor: pointer; transition: all var(--t-fast); outline: none; white-space: nowrap;
  }
  .demo-btn:hover { background: var(--s3); color: var(--t1); }
  .demo-btn.active { background: var(--s4); border-color: var(--b3); color: var(--t1); }
</style>
</head>
<body data-time="evening">

<div class="ambient-bg"></div>

<!-- ═══════════════════════════════════════════════════
     SECTION 1: Room mode (full-width rows)
     ═══════════════════════════════════════════════════ -->
<div class="cover-card-wrap">
  <div class="cover-header">
    <div class="cover-header-left">
      <span class="cover-title">Volets</span>
      <span class="cover-count" id="cover-count"></span>
    </div>
    <div class="cover-header-actions">
      <button class="header-btn" onclick="allOpen()" aria-label="Tout ouvrir"><i class="mdi mdi-arrow-up"></i></button>
      <button class="header-btn" onclick="allClose()" aria-label="Tout fermer"><i class="mdi mdi-arrow-down"></i></button>
    </div>
  </div>
  <div class="glass cover-card" id="card">
    <div class="tint" id="card-tint"></div>
    <div class="card-inner" id="cover-list"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════
     SECTION 2: Compact pair layout (dashboard mode)
     ═══════════════════════════════════════════════════ -->
<div class="cover-card-wrap">
  <div class="cover-header">
    <div class="cover-header-left">
      <span class="cover-title">Volets — Compact</span>
      <span class="cover-count" id="compact-count"></span>
    </div>
    <div class="cover-header-actions">
      <button class="header-btn" onclick="allOpenCompact()" aria-label="Tout ouvrir"><i class="mdi mdi-arrow-up"></i></button>
      <button class="header-btn" onclick="allCloseCompact()" aria-label="Tout fermer"><i class="mdi mdi-arrow-down"></i></button>
    </div>
  </div>
  <div class="glass cover-card" id="compact-card">
    <div class="tint" id="compact-tint"></div>
    <div class="card-inner" id="compact-list"></div>
  </div>
</div>

<div class="controls">
  <div class="controls-group">
    <span class="controls-label">Heure</span>
    <button class="demo-btn" onclick="setTime('morning',this)">Matin</button>
    <button class="demo-btn" onclick="setTime('day',this)">Jour</button>
    <button class="demo-btn active" onclick="setTime('evening',this)">Soir</button>
    <button class="demo-btn" onclick="setTime('night',this)">Nuit</button>
  </div>
  <div class="controls-group">
    <span class="controls-label">Etat</span>
    <button class="demo-btn" onclick="setGlobal('all-open',this)">Tout Ouvert</button>
    <button class="demo-btn active" onclick="setGlobal('partial',this)">Partiel</button>
    <button class="demo-btn" onclick="setGlobal('all-closed',this)">Tout Ferme</button>
  </div>
</div>

<script>
/* ================================================================
   HA COVER ENTITY MODEL
   ================================================================
   CoverEntityFeature bitmask:
     OPEN = 1, CLOSE = 2, SET_POSITION = 4, STOP = 8,
     OPEN_TILT = 16, CLOSE_TILT = 32, STOP_TILT = 64, SET_TILT_POSITION = 128
   States: open, opening, closed, closing
   Attributes: current_position, current_tilt_position
   device_class: awning, blind, curtain, damper, door, garage, gate, shade, shutter, window
   ================================================================ */

var F = {
  OPEN: 1, CLOSE: 2, SET_POSITION: 4, STOP: 8,
  OPEN_TILT: 16, CLOSE_TILT: 32, STOP_TILT: 64, SET_TILT_POSITION: 128
};

// ── Device class icon map [open, closed] ──
var DC_ICONS = {
  shutter:  ['mdi-window-shutter-open',  'mdi-window-shutter'],
  blind:    ['mdi-blinds-open',          'mdi-blinds'],
  curtain:  ['mdi-curtains',             'mdi-curtains-closed'],
  garage:   ['mdi-garage-open',          'mdi-garage'],
  gate:     ['mdi-gate-open',            'mdi-gate'],
  door:     ['mdi-door-open',            'mdi-door-closed'],
  awning:   ['mdi-awning-outline',       'mdi-awning-outline'],
  shade:    ['mdi-roller-shade-open',    'mdi-roller-shade'],
  window:   ['mdi-window-open',          'mdi-window-closed'],
  damper:   ['mdi-valve-open',           'mdi-valve']
};

function coverIcon(dc, isOpen) {
  var pair = DC_ICONS[dc] || DC_ICONS.shutter;
  return pair[isOpen ? 0 : 1];
}

// ── Transport icons per device_class category ──
var TRANSPORT = {
  vertical: { open: 'mdi-arrow-up',      close: 'mdi-arrow-down',      stop: 'mdi-stop' },
  garage:   { open: 'mdi-garage-open',    close: 'mdi-garage',          stop: 'mdi-stop' },
  gate:     { open: 'mdi-gate-open',      close: 'mdi-gate',            stop: 'mdi-stop' },
  door:     { open: 'mdi-door-open',      close: 'mdi-door-closed',     stop: null },
  damper:   { open: 'mdi-valve-open',     close: 'mdi-valve',           stop: null },
  window:   { open: 'mdi-window-open',    close: 'mdi-window-closed',   stop: null }
};

function getTransport(dc) {
  if (['shutter', 'blind', 'shade', 'curtain', 'awning'].indexOf(dc) !== -1) return TRANSPORT.vertical;
  return TRANSPORT[dc] || TRANSPORT.vertical;
}

function stateText(state) {
  switch (state) {
    case 'open': return 'Ouvert';
    case 'closed': return 'Ferme';
    case 'opening': return 'Ouverture...';
    case 'closing': return 'Fermeture...';
    default: return state;
  }
}

// Marquee: returns DOM element (span or text node)
function marqueeEl(text, maxChars) {
  maxChars = maxChars || 18;
  if (text.length <= maxChars) return document.createTextNode(text);
  var span = document.createElement('span');
  span.className = 'marquee';
  span.textContent = text + '\u00a0\u00a0\u00a0' + text + '\u00a0\u00a0\u00a0';
  return span;
}

// ── Cover definitions (simulates HA entities) ──
var coverDefs = {
  salon:      { name: 'Volet Salon',       device_class: 'shutter', supported_features: F.OPEN | F.CLOSE | F.SET_POSITION | F.STOP },
  cuisine:    { name: 'Volet Cuisine',      device_class: 'shutter', supported_features: F.OPEN | F.CLOSE | F.SET_POSITION | F.STOP },
  chambre:    { name: 'Volet Chambre',      device_class: 'shutter', supported_features: F.OPEN | F.CLOSE | F.SET_POSITION | F.STOP },
  bureau:     { name: 'Volet Bureau',       device_class: 'shutter', supported_features: F.OPEN | F.CLOSE | F.SET_POSITION | F.STOP },
  sdb:        { name: 'Volet SdB',          device_class: 'shutter', supported_features: F.OPEN | F.CLOSE | F.SET_POSITION | F.STOP },
  baie_salon: { name: 'Store Baie Vitree du Grand Salon', device_class: 'blind', supported_features: F.OPEN | F.CLOSE | F.SET_POSITION | F.STOP | F.OPEN_TILT | F.CLOSE_TILT | F.SET_TILT_POSITION | F.STOP_TILT },
  veranda:    { name: 'Store Veranda',      device_class: 'blind',   supported_features: F.OPEN | F.CLOSE | F.SET_POSITION | F.STOP | F.OPEN_TILT | F.CLOSE_TILT | F.SET_TILT_POSITION | F.STOP_TILT },
  garage:     { name: 'Porte Garage',       device_class: 'garage',  supported_features: F.OPEN | F.CLOSE | F.STOP },
  portail:    { name: 'Portail',            device_class: 'gate',    supported_features: F.OPEN | F.CLOSE | F.STOP }
};

var covers = {
  salon:      { position: 100, tilt: 0,  state: 'open' },
  cuisine:    { position: 65,  tilt: 0,  state: 'open' },
  chambre:    { position: 0,   tilt: 0,  state: 'closed' },
  bureau:     { position: 40,  tilt: 0,  state: 'open' },
  sdb:        { position: 0,   tilt: 0,  state: 'closed' },
  baie_salon: { position: 80,  tilt: 60, state: 'open' },
  veranda:    { position: 0,   tilt: 0,  state: 'closed' },
  garage:     { position: 0,   tilt: 0,  state: 'closed' },
  portail:    { position: 100, tilt: 0,  state: 'open' }
};

// Compact demo covers (subset for compact pair layout)
var compactDefs = {
  salon:   coverDefs.salon,
  cuisine: coverDefs.cuisine,
  chambre: coverDefs.chambre,
  bureau:  coverDefs.bureau,
  sdb:     coverDefs.sdb,
  garage:  coverDefs.garage
};

var compactCovers = {
  salon:   { position: 100, tilt: 0, state: 'open' },
  cuisine: { position: 65,  tilt: 0, state: 'open' },
  chambre: { position: 0,   tilt: 0, state: 'closed' },
  bureau:  { position: 40,  tilt: 0, state: 'open' },
  sdb:     { position: 0,   tilt: 0, state: 'closed' },
  garage:  { position: 0,   tilt: 0, state: 'closed' }
};

// Presets (matches production defaults: [0, 25, 50, 75, 100])
var DEFAULT_PRESETS = [0, 25, 50, 75, 100];

var activeCover = null;
var activeCompact = null;

/* ================================================================
   DOM HELPERS
   ================================================================ */
function el(tag, cls, attrs) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (attrs) {
    var keys = Object.keys(attrs);
    for (var k = 0; k < keys.length; k++) {
      var key = keys[k];
      if (key === 'text') e.textContent = attrs[key];
      else e.setAttribute(key, attrs[key]);
    }
  }
  return e;
}

function ico(name) {
  var i = document.createElement('i');
  i.className = 'mdi ' + name;
  return i;
}

/* ================================================================
   RENDER — Room mode (full-width rows)
   ================================================================ */
function render() {
  var list = document.getElementById('cover-list');
  var wasActive = activeCover;

  while (list.firstChild) list.removeChild(list.firstChild);

  var ids = Object.keys(coverDefs);
  for (var idx = 0; idx < ids.length; idx++) {
    var id = ids[idx];
    var isExpanded = wasActive === id;
    var isLast = idx === ids.length - 1;

    // Row (full-width)
    list.appendChild(buildRow(id, coverDefs, covers, false, false));

    // Top fold-sep
    var sepTop = el('div', 'fold-sep');
    list.appendChild(sepTop);

    // Fold
    var fold = buildFold(id, isExpanded, coverDefs, covers);
    list.appendChild(fold);

    // Bottom fold-sep — conditional: NOT for the last item
    var sepBottom = null;
    if (!isLast) {
      sepBottom = el('div', 'fold-sep');
      list.appendChild(sepBottom);
    }

    if (isExpanded) {
      activeCover = id;
      if (wasActive === id) {
        fold.classList.add('open');
        sepTop.classList.add('visible');
        if (sepBottom) sepBottom.classList.add('visible');
      } else {
        (function(f, st, sb) {
          requestAnimationFrame(function() { requestAnimationFrame(function() {
            f.classList.add('open');
            st.classList.add('visible');
            if (sb) sb.classList.add('visible');
          }); });
        })(fold, sepTop, sepBottom);
      }
    }
  }

  updateHeader();
  updateTint();
}

/* ================================================================
   RENDER — Compact pair layout (dashboard mode)
   ================================================================ */
function renderCompact() {
  var list = document.getElementById('compact-list');
  var wasActive = activeCompact;

  while (list.firstChild) list.removeChild(list.firstChild);

  var ids = Object.keys(compactDefs);
  var i = 0;
  while (i < ids.length) {
    var leftId = ids[i];
    var rightId = (i + 1 < ids.length) ? ids[i + 1] : null;

    if (rightId) {
      // Compact pair: two rows side-by-side
      list.appendChild(buildRow(leftId, compactDefs, compactCovers, true, false));
      list.appendChild(buildRow(rightId, compactDefs, compactCovers, true, true));

      var isLastPair = (i + 2 >= ids.length);

      // Folds for each cover in the pair
      var leftExpanded = wasActive === leftId;
      var rightExpanded = wasActive === rightId;

      // Left fold
      var sepTopL = el('div', 'fold-sep');
      list.appendChild(sepTopL);
      var foldL = buildFold(leftId, leftExpanded, compactDefs, compactCovers);
      list.appendChild(foldL);
      var sepBotL = null;
      if (!isLastPair) {
        sepBotL = el('div', 'fold-sep');
        list.appendChild(sepBotL);
      }

      if (leftExpanded) {
        activeCompact = leftId;
        foldL.classList.add('open');
        sepTopL.classList.add('visible');
        if (sepBotL) sepBotL.classList.add('visible');
      }

      // Right fold
      var sepTopR = el('div', 'fold-sep');
      list.appendChild(sepTopR);
      var foldR = buildFold(rightId, rightExpanded, compactDefs, compactCovers);
      list.appendChild(foldR);
      var sepBotR = null;
      if (!isLastPair) {
        sepBotR = el('div', 'fold-sep');
        list.appendChild(sepBotR);
      }

      if (rightExpanded) {
        activeCompact = rightId;
        foldR.classList.add('open');
        sepTopR.classList.add('visible');
        if (sepBotR) sepBotR.classList.add('visible');
      }

      i += 2;
    } else {
      // Odd cover: full-width
      list.appendChild(buildRow(leftId, compactDefs, compactCovers, false, false));

      var sepTop = el('div', 'fold-sep');
      list.appendChild(sepTop);
      var fold = buildFold(leftId, wasActive === leftId, compactDefs, compactCovers);
      list.appendChild(fold);
      // Last item, no bottom sep

      if (wasActive === leftId) {
        activeCompact = leftId;
        fold.classList.add('open');
        sepTop.classList.add('visible');
      }

      i++;
    }
  }

  updateCompactHeader();
  updateCompactTint();
}

/* ================================================================
   BUILD ROW (shared by both modes)
   ================================================================ */
function buildRow(id, defs, cvData, compact, isRight) {
  var def = defs[id];
  var cv = cvData[id];
  var isOpen = cv.state === 'open' || cv.state === 'opening';

  var cls = 'cv-row';
  if (isOpen) cls += ' open';
  if (compact) cls += ' compact';
  if (isRight) cls += ' compact-right';
  var row = el('div', cls);

  // Icon button (toggle cover)
  var iconBtn = el('button', 'cv-icon-btn');
  iconBtn.setAttribute('aria-label', (isOpen ? 'Fermer ' : 'Ouvrir ') + def.name);
  iconBtn.appendChild(ico(coverIcon(def.device_class, isOpen)));
  iconBtn.addEventListener('click', (function(coverId, data) {
    return function(e) {
      e.stopPropagation();
      var c = data[coverId];
      if (c.position > 0) { c.position = 0; c.tilt = 0; c.state = 'closed'; }
      else { c.position = 100; c.state = 'open'; }
      if (data === covers) render(); else renderCompact();
    };
  })(id, cvData));
  row.appendChild(iconBtn);

  // Expand button (wraps info + position + dot)
  var isActive = (cvData === covers ? activeCover : activeCompact) === id;
  var expandBtn = el('button', 'cv-expand-btn');
  expandBtn.setAttribute('aria-expanded', isActive ? 'true' : 'false');
  expandBtn.setAttribute('aria-label', 'Details ' + def.name);

  // Info
  var info = el('div', 'cv-info');
  var nameDiv = el('div', 'cv-name');
  nameDiv.appendChild(marqueeEl(def.name, compact ? 12 : 18));
  info.appendChild(nameDiv);
  var sub = el('div', 'cv-sub');
  sub.appendChild(el('span', 'cv-state-text', { text: stateText(cv.state) }));
  info.appendChild(sub);
  expandBtn.appendChild(info);

  // Position (only if SET_POSITION)
  if (def.supported_features & F.SET_POSITION) {
    var pos = el('div', 'cv-position');
    pos.textContent = cv.position;
    var u = document.createElement('span');
    u.className = 'unit';
    u.textContent = '%';
    pos.appendChild(u);
    expandBtn.appendChild(pos);
  }

  // Dot
  expandBtn.appendChild(el('div', 'cv-dot'));

  expandBtn.addEventListener('click', (function(coverId, data) {
    return function() {
      if (data === covers) togglePanel(coverId);
      else toggleCompactPanel(coverId);
    };
  })(id, cvData));

  row.appendChild(expandBtn);
  return row;
}

function buildFold(id, withControls, defs, cvData) {
  var fold = el('div', 'ctrl-fold');
  var inner = el('div', 'ctrl-fold-inner');
  var panel = el('div', 'ctrl-panel');
  if (withControls) populateControls(panel, id, defs, cvData);
  inner.appendChild(panel);
  fold.appendChild(inner);
  return fold;
}

/* ================================================================
   PANEL
   ================================================================ */
function togglePanel(id) {
  if (activeCover && activeCover !== id) {
    activeCover = null;
    render();
    activeCover = id;
    render();
    return;
  }
  if (activeCover === id) {
    activeCover = null;
  } else {
    activeCover = id;
  }
  render();
}

function toggleCompactPanel(id) {
  if (activeCompact && activeCompact !== id) {
    activeCompact = null;
    renderCompact();
    activeCompact = id;
    renderCompact();
    return;
  }
  if (activeCompact === id) {
    activeCompact = null;
  } else {
    activeCompact = id;
  }
  renderCompact();
}

function populateControls(panel, id, defs, cvData) {
  var def = defs[id];
  var cv = cvData[id];
  var sf = def.supported_features;
  var isOpen = cv.state === 'open' || cv.state === 'opening';
  var renderFn = (cvData === covers) ? render : renderCompact;

  panel.appendChild(el('span', 'ctrl-label', { text: def.name }));

  // Transport (adapted per device_class)
  var tp = getTransport(def.device_class);
  var tr = el('div', 'transport-row');

  if (sf & F.OPEN) {
    var oBtn = el('button', 'transport-btn' + (cv.position === 100 || (!(sf & F.SET_POSITION) && isOpen) ? ' accent' : ''));
    oBtn.setAttribute('aria-label', 'Ouvrir ' + def.name);
    oBtn.appendChild(ico(tp.open));
    oBtn.addEventListener('click', (function(coverId, data, fn) {
      return function(e) { e.stopPropagation(); data[coverId].position = 100; data[coverId].state = 'open'; fn(); };
    })(id, cvData, renderFn));
    tr.appendChild(oBtn);
  }

  if (sf & F.STOP && tp.stop) {
    var sBtn = el('button', 'transport-btn');
    sBtn.setAttribute('aria-label', 'Stop ' + def.name);
    sBtn.appendChild(ico(tp.stop));
    sBtn.addEventListener('click', function(e) { e.stopPropagation(); });
    tr.appendChild(sBtn);
  }

  if (sf & F.CLOSE) {
    var cBtn = el('button', 'transport-btn' + (cv.position === 0 || (!(sf & F.SET_POSITION) && !isOpen) ? ' accent' : ''));
    cBtn.setAttribute('aria-label', 'Fermer ' + def.name);
    cBtn.appendChild(ico(tp.close));
    cBtn.addEventListener('click', (function(coverId, data, fn) {
      return function(e) { e.stopPropagation(); data[coverId].position = 0; data[coverId].tilt = 0; data[coverId].state = 'closed'; fn(); };
    })(id, cvData, renderFn));
    tr.appendChild(cBtn);
  }

  panel.appendChild(tr);

  // Position slider (only if SET_POSITION)
  if (sf & F.SET_POSITION) {
    var posWrap = el('div', 'slider-wrap');
    var iClosed = el('div', 'slider-icon'); iClosed.appendChild(ico(coverIcon(def.device_class, false))); posWrap.appendChild(iClosed);
    posWrap.appendChild(mkSlider('position', id, cv.position, cvData, renderFn));
    var iOpen = el('div', 'slider-icon'); iOpen.appendChild(ico(coverIcon(def.device_class, true))); posWrap.appendChild(iOpen);
    panel.appendChild(posWrap);
  }

  // Tilt slider (SET_TILT_POSITION)
  if (sf & F.SET_TILT_POSITION) {
    panel.appendChild(el('span', 'ctrl-label', { text: 'Inclinaison' }));
    var tiltWrap = el('div', 'slider-wrap');
    var iL = el('div', 'slider-icon'); iL.appendChild(ico('mdi-blinds')); tiltWrap.appendChild(iL);
    tiltWrap.appendChild(mkSlider('tilt', id, cv.tilt, cvData, renderFn));
    var iR = el('div', 'slider-icon'); iR.appendChild(ico('mdi-blinds-open')); tiltWrap.appendChild(iR);
    panel.appendChild(tiltWrap);
  }

  // Presets
  panel.appendChild(el('div', 'ctrl-sep'));
  var pr = el('div', 'preset-row');

  if (sf & F.SET_POSITION) {
    for (var p = 0; p < DEFAULT_PRESETS.length; p++) {
      (function(preset) {
        var isPresetOpen = preset >= 50;
        var label = preset === 0 ? 'Ferme' : preset === 100 ? 'Ouvert' : preset + '%';
        var chip = el('button', 'chip' + (cv.position === preset ? ' active' : ''));
        chip.appendChild(ico(coverIcon(def.device_class, isPresetOpen)));
        var s = document.createElement('span'); s.textContent = label; chip.appendChild(s);
        chip.setAttribute('aria-label', label);
        chip.addEventListener('click', (function(coverId, data, fn) {
          return function(e) {
            e.stopPropagation();
            data[coverId].position = preset;
            data[coverId].state = preset > 0 ? 'open' : 'closed';
            fn();
          };
        })(id, cvData, renderFn));
        pr.appendChild(chip);
      })(DEFAULT_PRESETS[p]);
    }
  } else {
    // Binary: open/close only
    var openChip = el('button', 'chip' + (isOpen ? ' active' : ''));
    openChip.appendChild(ico(coverIcon(def.device_class, true)));
    var os = document.createElement('span'); os.textContent = 'Ouvert'; openChip.appendChild(os);
    openChip.setAttribute('aria-label', 'Ouvert');
    openChip.addEventListener('click', (function(coverId, data, fn) {
      return function(e) { e.stopPropagation(); data[coverId].position = 100; data[coverId].state = 'open'; fn(); };
    })(id, cvData, renderFn));
    pr.appendChild(openChip);

    var closeChip = el('button', 'chip' + (!isOpen ? ' active' : ''));
    closeChip.appendChild(ico(coverIcon(def.device_class, false)));
    var cs = document.createElement('span'); cs.textContent = 'Ferme'; closeChip.appendChild(cs);
    closeChip.setAttribute('aria-label', 'Ferme');
    closeChip.addEventListener('click', (function(coverId, data, fn) {
      return function(e) { e.stopPropagation(); data[coverId].position = 0; data[coverId].tilt = 0; data[coverId].state = 'closed'; fn(); };
    })(id, cvData, renderFn));
    pr.appendChild(closeChip);
  }

  panel.appendChild(pr);
}

/* ================================================================
   SLIDER
   ================================================================ */
function mkSlider(type, coverId, value, cvData, renderFn) {
  var s = el('div', 'slider');
  var fill = el('div', 'slider-fill'); fill.style.width = value + '%'; s.appendChild(fill);
  var thumb = el('div', 'slider-thumb'); thumb.style.left = value + '%'; s.appendChild(thumb);
  var val = el('div', 'slider-val'); val.textContent = value + '%'; s.appendChild(val);

  s.addEventListener('pointerdown', function(e) {
    e.stopPropagation();
    s.setPointerCapture(e.pointerId);

    function upd(evt) {
      var r = s.getBoundingClientRect();
      var pct = Math.max(0, Math.min(100, Math.round(((evt.clientX - r.left) / r.width) * 100)));
      fill.style.width = pct + '%'; thumb.style.left = pct + '%'; val.textContent = pct + '%';
      var cv = cvData[coverId];
      if (type === 'position') { cv.position = pct; cv.state = pct > 0 ? 'open' : 'closed'; }
      else { cv.tilt = pct; }
    }

    upd(e);
    function mv(evt) { upd(evt); }
    function up() { s.removeEventListener('pointermove', mv); s.removeEventListener('pointerup', up); renderFn(); }
    s.addEventListener('pointermove', mv);
    s.addEventListener('pointerup', up);
  });

  return s;
}

/* ================================================================
   HEADER & TINT — Room mode
   ================================================================ */
function updateHeader() {
  var ids = Object.keys(covers);
  var n = 0;
  for (var i = 0; i < ids.length; i++) {
    if (covers[ids[i]].position > 0) n++;
  }
  var badge = document.getElementById('cover-count');
  badge.textContent = n + '/' + ids.length;
  badge.className = 'cover-count ' + (n === 0 ? 'none' : n === ids.length ? 'all' : 'some');
}

function updateTint() {
  var tint = document.getElementById('card-tint');
  var ids = Object.keys(covers);
  var n = 0;
  for (var i = 0; i < ids.length; i++) {
    if (covers[ids[i]].position > 0) n++;
  }
  var ratio = n / ids.length;
  if (n === 0) { tint.style.opacity = '0'; return; }
  tint.style.background = 'radial-gradient(ellipse at 50% 50%, var(--cv-color, #a78bfa), transparent 70%)';
  tint.style.opacity = (ratio * 0.18).toFixed(3);
}

/* ================================================================
   HEADER & TINT — Compact mode
   ================================================================ */
function updateCompactHeader() {
  var ids = Object.keys(compactCovers);
  var n = 0;
  for (var i = 0; i < ids.length; i++) {
    if (compactCovers[ids[i]].position > 0) n++;
  }
  var badge = document.getElementById('compact-count');
  badge.textContent = n + '/' + ids.length;
  badge.className = 'cover-count ' + (n === 0 ? 'none' : n === ids.length ? 'all' : 'some');
}

function updateCompactTint() {
  var tint = document.getElementById('compact-tint');
  var ids = Object.keys(compactCovers);
  var n = 0;
  for (var i = 0; i < ids.length; i++) {
    if (compactCovers[ids[i]].position > 0) n++;
  }
  var ratio = n / ids.length;
  if (n === 0) { tint.style.opacity = '0'; return; }
  tint.style.background = 'radial-gradient(ellipse at 50% 50%, var(--cv-color, #a78bfa), transparent 70%)';
  tint.style.opacity = (ratio * 0.18).toFixed(3);
}

function allOpen() {
  var ids = Object.keys(covers);
  for (var i = 0; i < ids.length; i++) { covers[ids[i]].position = 100; covers[ids[i]].state = 'open'; }
  render();
}
function allClose() {
  var ids = Object.keys(covers);
  for (var i = 0; i < ids.length; i++) { covers[ids[i]].position = 0; covers[ids[i]].tilt = 0; covers[ids[i]].state = 'closed'; }
  render();
}

function allOpenCompact() {
  var ids = Object.keys(compactCovers);
  for (var i = 0; i < ids.length; i++) { compactCovers[ids[i]].position = 100; compactCovers[ids[i]].state = 'open'; }
  renderCompact();
}
function allCloseCompact() {
  var ids = Object.keys(compactCovers);
  for (var i = 0; i < ids.length; i++) { compactCovers[ids[i]].position = 0; compactCovers[ids[i]].tilt = 0; compactCovers[ids[i]].state = 'closed'; }
  renderCompact();
}

/* ================================================================
   DEMO CONTROLS
   ================================================================ */
function setTime(t, btn) {
  document.body.setAttribute('data-time', t);
  btn.parentElement.querySelectorAll('.demo-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}

function setGlobal(state, btn) {
  btn.parentElement.querySelectorAll('.demo-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  if (state === 'all-open') {
    allOpen(); allOpenCompact(); return;
  }
  if (state === 'all-closed') {
    allClose(); allCloseCompact(); return;
  }
  // Partial state
  covers.salon.position = 100; covers.salon.state = 'open'; covers.salon.tilt = 0;
  covers.cuisine.position = 65; covers.cuisine.state = 'open'; covers.cuisine.tilt = 0;
  covers.chambre.position = 0; covers.chambre.state = 'closed'; covers.chambre.tilt = 0;
  covers.bureau.position = 40; covers.bureau.state = 'open'; covers.bureau.tilt = 0;
  covers.sdb.position = 0; covers.sdb.state = 'closed'; covers.sdb.tilt = 0;
  covers.baie_salon.position = 80; covers.baie_salon.state = 'open'; covers.baie_salon.tilt = 60;
  covers.veranda.position = 0; covers.veranda.state = 'closed'; covers.veranda.tilt = 0;
  covers.garage.position = 0; covers.garage.state = 'closed'; covers.garage.tilt = 0;
  covers.portail.position = 100; covers.portail.state = 'open'; covers.portail.tilt = 0;
  activeCover = null;
  render();

  compactCovers.salon.position = 100; compactCovers.salon.state = 'open';
  compactCovers.cuisine.position = 65; compactCovers.cuisine.state = 'open';
  compactCovers.chambre.position = 0; compactCovers.chambre.state = 'closed';
  compactCovers.bureau.position = 40; compactCovers.bureau.state = 'open';
  compactCovers.sdb.position = 0; compactCovers.sdb.state = 'closed';
  compactCovers.garage.position = 0; compactCovers.garage.state = 'closed';
  activeCompact = null;
  renderCompact();
}

// ── Init ──
render();
renderCompact();
</script>
