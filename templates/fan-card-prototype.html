<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Fan Card — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
<style>
  :root {
    --radius-xl: 22px;
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 8px;
    --radius-full: 9999px;

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-std: cubic-bezier(0.4, 0, 0.2, 1);
    --t-slow: 1.2s var(--ease-std);
    --t-med: 0.4s var(--ease-std);
    --t-fast: 0.2s var(--ease-std);
    --t-layout: 0.35s var(--ease-out);

    --c-success: #4ade80;
    --c-alert: #f87171;
    --c-warning: #fbbf24;
    --c-info: #60a5fa;
    --c-accent: #818cf8;

    --t1: rgba(255, 255, 255, 0.88);
    --t2: rgba(255, 255, 255, 0.60);
    --t3: rgba(255, 255, 255, 0.45);
    --t4: rgba(255, 255, 255, 0.25);

    --s1: rgba(255, 255, 255, 0.04);
    --s2: rgba(255, 255, 255, 0.06);
    --s3: rgba(255, 255, 255, 0.08);
    --s4: rgba(255, 255, 255, 0.12);

    --b1: rgba(255, 255, 255, 0.06);
    --b2: rgba(255, 255, 255, 0.08);
    --b3: rgba(255, 255, 255, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #111827;
    color: var(--t1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 120px;
    gap: 12px;
    transition: background var(--t-slow);
  }

  /* ── Ambient ── */
  .ambient-bg { position: fixed; inset: 0; z-index: -1; transition: all var(--t-slow); }
  .ambient-bg::before, .ambient-bg::after {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(120px); opacity: 0.4; transition: all var(--t-slow);
  }
  .ambient-bg::before { width: 600px; height: 600px; top: -200px; right: -100px; }
  .ambient-bg::after { width: 500px; height: 500px; bottom: -150px; left: -100px; }

  body[data-time="morning"] { background: #0f1923; }
  body[data-time="morning"] .ambient-bg::before { background: #1a6b8a; }
  body[data-time="morning"] .ambient-bg::after { background: #2d8a6e; }
  body[data-time="day"] { background: #111827; }
  body[data-time="day"] .ambient-bg::before { background: #3b6fa0; }
  body[data-time="day"] .ambient-bg::after { background: #4a90a0; }
  body[data-time="evening"] { background: #1a1118; }
  body[data-time="evening"] .ambient-bg::before { background: #8a4a2d; }
  body[data-time="evening"] .ambient-bg::after { background: #6b3a5a; }
  body[data-time="night"] { background: #0a0e1a; }
  body[data-time="night"] .ambient-bg::before { background: #1a2040; }
  body[data-time="night"] .ambient-bg::after { background: #2a1a3a; }

  /* ── Glass ── */
  .glass {
    position: relative; border-radius: var(--radius-xl);
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0.06) 100%);
    backdrop-filter: blur(40px) saturate(1.4);
    -webkit-backdrop-filter: blur(40px) saturate(1.4);
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.1), 0 8px 32px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.15);
    border: 1px solid var(--b2); transition: border-color var(--t-fast);
  }
  @media (hover: hover) and (pointer: fine) {
    .glass:hover { border-color: rgba(255,255,255,0.13); }
  }

  .tint {
    position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none; z-index: 0;
    transition: opacity var(--t-slow), background var(--t-slow);
  }

  /* ── Card wrap ── */
  .fan-card-wrap { width: 500px; max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .fan-card { width: 100%; padding: 2px 14px; }
  .card-inner {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  }

  /* ── Card header ── */
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px; margin-bottom: 6px; min-height: 22px;
  }
  .card-header-left { display: flex; align-items: center; gap: 8px; }
  .card-title {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--t4);
  }
  .card-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 14px; height: 14px; padding: 0 4px;
    border-radius: var(--radius-full); font-size: 9px; font-weight: 600;
    transition: all var(--t-med);
  }
  .card-count.some { background: rgba(129,140,248,0.15); color: var(--c-accent); }
  .card-count.none { background: var(--s2); color: var(--t3); }
  .card-count.all { background: rgba(129,140,248,0.2); color: var(--c-accent); }

  .toggle-all {
    position: relative; width: 40px; height: 22px; border-radius: 11px;
    background: var(--s2); border: 1px solid var(--b2); cursor: pointer;
    transition: all var(--t-fast); padding: 0; outline: none;
    font-family: inherit; -webkit-tap-highlight-color: transparent;
  }
  .toggle-all::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--t3);
    transition: transform var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
  }
  .toggle-all.on { background: rgba(129,140,248,0.2); border-color: rgba(129,140,248,0.3); }
  .toggle-all.on::after {
    transform: translateX(18px); background: var(--c-accent);
    box-shadow: 0 0 8px rgba(129,140,248,0.4);
  }
  .toggle-all:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: 2px; }

  /* ── Fan row ── */
  .fan-row {
    display: flex; align-items: center; gap: 10px;
    grid-column: 1 / -1;
    padding: 8px 4px; position: relative;
    transition: background var(--t-fast); border-radius: var(--radius-md);
  }
  .fan-row.compact { grid-column: span 1; min-width: 0; overflow: hidden; }
  .fan-row.compact-right { padding-left: 10px; }
  .fan-row.compact-right::before {
    content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.08) 30%, rgba(255,255,255,0.08) 70%, transparent);
  }
  @media (hover: hover) and (pointer: fine) {
    .fan-row:hover { background: var(--s1); }
  }
  @media (pointer: coarse) {
    .fan-row:active { animation: bounce 0.3s ease; }
  }

  .fan-icon-btn {
    width: 36px; height: 36px; border-radius: var(--radius-md);
    background: var(--s2); border: 1px solid var(--b1);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all var(--t-fast); cursor: pointer; padding: 0; outline: none;
    font-family: inherit; -webkit-tap-highlight-color: transparent;
  }
  .fan-icon-btn i {
    font-size: 18px; color: var(--t3);
    display: flex; align-items: center; justify-content: center;
    transition: color var(--t-fast), filter var(--t-fast);
  }
  .fan-icon-btn:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) {
    .fan-icon-btn:hover { background: var(--s3); border-color: var(--b2); }
    .fan-icon-btn:hover i { color: var(--t2); }
  }
  @media (hover: hover) and (pointer: fine) {
    .fan-icon-btn:active { transform: scale(0.96); }
  }
  @media (pointer: coarse) {
    .fan-icon-btn:active { animation: bounce 0.3s ease; }
  }

  .fan-row.on .fan-icon-btn {
    background: rgba(129,140,248,0.1); border-color: rgba(129,140,248,0.15);
  }
  .fan-row.on .fan-icon-btn i {
    color: #818cf8; filter: drop-shadow(0 0 6px rgba(129,140,248,0.4));
  }

  /* ── Expand button (separate from icon-btn) ── */
  .fan-expand-btn {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    background: none; border: none; padding: 0;
    font-family: inherit; cursor: pointer; outline: none;
    text-align: left; color: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .fan-expand-btn:focus-visible {
    outline: 2px solid rgba(255,255,255,0.25); outline-offset: 2px;
    border-radius: var(--radius-sm);
  }

  /* Spinning animation — speed varies by percentage */
  @keyframes spin-fan {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes spin-fan-reverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }
  .fan-row.on .fan-icon-btn i.spinning {
    animation: spin-fan var(--spin-duration, 2s) linear infinite;
  }
  .fan-row.on .fan-icon-btn i.spinning.reverse {
    animation: spin-fan-reverse var(--spin-duration, 2s) linear infinite;
  }

  .fan-info { flex: 1; min-width: 0; }
  .fan-name {
    font-size: 13px; font-weight: 600; color: var(--t1); line-height: 1.2;
    white-space: nowrap; overflow: hidden;
  }
  .fan-sub { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .fan-speed-text {
    font-size: 10px; font-weight: 500; color: var(--t3);
    transition: color var(--t-med);
  }
  .fan-row.on .fan-speed-text { color: rgba(129,140,248,0.55); }

  .fan-direction {
    font-size: 10px; font-weight: 400; color: var(--t4);
    display: flex; align-items: center; gap: 3px;
  }
  .fan-direction i {
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }

  .fan-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--t4); transition: all var(--t-med);
  }
  .fan-row.on .fan-dot {
    background: #818cf8; box-shadow: 0 0 8px rgba(129,140,248,0.4);
  }

  /* ── Fold separator ── */
  .fold-sep {
    grid-column: 1 / -1;
    height: 1px; margin: 0 12px; overflow: hidden;
    background: linear-gradient(90deg, transparent, rgba(129,140,248,0.2), transparent);
    opacity: 0; transition: opacity var(--t-layout);
  }
  .fold-sep.visible { opacity: 1; }

  /* ── Controls fold (CSS Grid + opacity fade) ── */
  .ctrl-fold {
    grid-column: 1 / -1;
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows var(--t-layout);
  }
  .ctrl-fold.open { grid-template-rows: 1fr; }
  .ctrl-fold-inner {
    overflow: hidden;
    opacity: 0; transition: opacity var(--t-fast);
  }
  .ctrl-fold.open .ctrl-fold-inner { opacity: 1; transition-delay: 0.1s; }

  .ctrl-panel {
    padding: 6px 0 4px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .ctrl-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
    color: rgba(129,140,248,0.6); text-transform: uppercase;
  }

  /* ── Slider ── */
  .slider-wrap { display: flex; align-items: center; gap: 8px; }
  .slider-icon {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; flex-shrink: 0;
  }
  .slider-icon i {
    font-size: 18px; color: var(--t3);
    display: flex; align-items: center; justify-content: center;
  }
  .slider {
    position: relative; flex: 1; height: 36px;
    border-radius: var(--radius-lg); background: var(--s1);
    border: 1px solid var(--b1); overflow: hidden; cursor: pointer;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .slider-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    border-radius: inherit; pointer-events: none;
    transition: width 0.05s linear;
  }
  .slider-fill.accent {
    background: linear-gradient(90deg, rgba(129,140,248,0.15), rgba(129,140,248,0.25));
  }
  .slider-fill.warm {
    background: linear-gradient(90deg, rgba(251,191,36,0.15), rgba(251,191,36,0.3));
  }
  .slider-thumb {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 8px; height: 20px; border-radius: 4px;
    background: rgba(255,255,255,0.7); box-shadow: 0 0 8px rgba(255,255,255,0.2);
    pointer-events: none; transition: left 0.05s linear;
  }
  .slider-val {
    position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
    font-size: 11px; font-weight: 600; color: var(--t3); pointer-events: none;
  }

  /* ── Speed steps (discrete levels) ── */
  .speed-steps {
    display: flex; gap: 4px;
  }
  .speed-step {
    flex: 1; height: 36px; border-radius: var(--radius-md);
    background: var(--s1); border: 1px solid var(--b1);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: inherit; font-size: 11px; font-weight: 700; color: var(--t3);
    cursor: pointer; transition: all var(--t-fast); outline: none; padding: 2px 0;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) and (pointer: fine) {
    .speed-step:hover { background: var(--s3); border-color: var(--b2); color: var(--t2); }
  }
  .speed-step:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) {
    .speed-step:active { transform: scale(0.96); }
  }
  @media (pointer: coarse) {
    .speed-step:active { animation: bounce 0.3s ease; }
  }
  .speed-step.active {
    background: rgba(129,140,248,0.1); border-color: rgba(129,140,248,0.15);
    color: #818cf8;
  }
  .speed-step-pct {
    font-size: 7px; font-weight: 600; color: var(--t4);
    letter-spacing: 0.3px; margin-top: 1px;
  }
  .speed-step.active .speed-step-pct { color: rgba(129,140,248,0.55); }

  /* ── Mode chips ── */
  .mode-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: var(--radius-md);
    border: 1px solid var(--b2); background: var(--s1);
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--t3); cursor: pointer; transition: all var(--t-fast);
    outline: none; -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) and (pointer: fine) {
    .chip:hover { background: var(--s3); color: var(--t2); border-color: var(--b3); }
  }
  .chip:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) {
    .chip:active { transform: scale(0.96); }
  }
  @media (pointer: coarse) {
    .chip:active { animation: bounce 0.3s ease; }
  }
  .chip.active {
    border-color: rgba(129,140,248,0.15); background: rgba(129,140,248,0.1);
    color: rgba(129,140,248,0.8);
  }
  .chip i {
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── Direction toggle ── */
  .direction-row {
    display: flex; align-items: center; gap: 10px;
  }
  .direction-label {
    font-size: 11px; font-weight: 600; color: var(--t2); flex: 1;
    display: flex; align-items: center; gap: 6px;
  }
  .direction-label i {
    font-size: 16px; opacity: 0.6;
    display: flex; align-items: center; justify-content: center;
  }
  .direction-btns {
    display: flex; gap: 0; border-radius: 10px;
    border: 1px solid var(--b2); background: var(--s1); overflow: hidden;
  }
  .dir-btn {
    width: 36px; height: 28px; display: flex;
    align-items: center; justify-content: center;
    background: transparent; border: none; color: var(--t3);
    cursor: pointer; transition: all var(--t-fast); outline: none; padding: 0;
    font-family: inherit; -webkit-tap-highlight-color: transparent;
  }
  .dir-btn i {
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  @media (hover: hover) and (pointer: fine) {
    .dir-btn:hover { background: var(--s3); color: var(--t2); }
  }
  .dir-btn:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) {
    .dir-btn:active { transform: scale(0.96); }
  }
  @media (pointer: coarse) {
    .dir-btn:active { animation: bounce 0.3s ease; }
  }
  .dir-btn.active { background: rgba(129,140,248,0.1); color: #818cf8; }
  .dir-btn + .dir-btn { border-left: 1px solid var(--b1); }

  /* ── Oscillation toggle ── */
  .osc-row {
    display: flex; align-items: center; gap: 10px;
  }
  .osc-label {
    font-size: 11px; font-weight: 600; color: var(--t2); flex: 1;
    display: flex; align-items: center; gap: 6px;
  }
  .osc-label i {
    font-size: 16px; opacity: 0.6;
    display: flex; align-items: center; justify-content: center;
  }
  .toggle-sm {
    position: relative; width: 38px; height: 20px; border-radius: 10px;
    background: var(--s2); border: 1px solid var(--b2);
    cursor: pointer; transition: all var(--t-fast);
    padding: 0; outline: none; font-family: inherit; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle-sm::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--t3); transition: all var(--t-fast);
  }
  .toggle-sm.on { background: rgba(129,140,248,0.2); border-color: rgba(129,140,248,0.3); }
  .toggle-sm.on::after {
    transform: translateX(18px); background: var(--c-accent);
    box-shadow: 0 0 8px rgba(129,140,248,0.4);
  }
  .toggle-sm:focus-visible { outline: 2px solid rgba(255,255,255,0.25); outline-offset: 2px; }

  /* ── Ceiling fan light (separate HA entity, shown as convenience) ── */
  .ceiling-light-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0;
  }
  .ceiling-light-label {
    font-size: 11px; font-weight: 600; color: var(--t2); flex: 1;
    display: flex; align-items: center; gap: 6px;
  }
  .ceiling-light-label i {
    font-size: 16px; opacity: 0.6;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── Separator ── */
  .ctrl-sep {
    height: 1px; background: var(--b1); margin: 2px 0;
  }

  /* ── Empty state ── */
  .empty-state {
    grid-column: 1 / -1;
    padding: 16px; text-align: center; font-size: 12px; color: var(--t4);
  }

  /* ── Marquee ── */
  .marquee {
    display: inline-block; white-space: nowrap;
    animation: marquee-scroll 6s linear infinite;
  }
  @keyframes marquee-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ── Bounce (touch feedback) ── */
  @keyframes bounce {
    0% { transform: scale(1); }
    40% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  /* ── Demo controls ── */
  .controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 10px 16px;
    border-radius: 20px; background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px); border: 1px solid var(--b2);
    z-index: 100; flex-wrap: wrap; justify-content: center; max-width: 92vw;
  }
  .controls-group { display: flex; gap: 5px; align-items: center; }
  .controls-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--t4); margin-right: 2px;
  }
  .demo-btn {
    padding: 6px 12px; border: 1px solid var(--b2);
    border-radius: var(--radius-md); background: var(--s1); color: var(--t3);
    font-family: inherit; font-size: 11px; font-weight: 500;
    cursor: pointer; transition: all var(--t-fast); outline: none; white-space: nowrap;
  }
  @media (hover: hover) and (pointer: fine) {
    .demo-btn:hover { background: var(--s3); color: var(--t1); }
  }
  .demo-btn.active { background: var(--s4); border-color: var(--b3); color: var(--t1); }
</style>
</head>
<body data-time="evening">

<div class="ambient-bg"></div>

<!-- Fan Card -->
<div class="fan-card-wrap" id="fan-card-wrap">
  <div class="card-header">
    <div class="card-header-left">
      <span class="card-title" id="card-title">Ventilation</span>
      <span class="card-count" id="card-count"></span>
    </div>
    <button class="toggle-all" id="toggle-all" onclick="toggleAll()" aria-label="Tout allumer/eteindre"></button>
  </div>
  <div class="glass fan-card" id="card">
    <div class="tint" id="card-tint"></div>
    <div class="card-inner" id="fan-list"></div>
  </div>
</div>

<!-- Demo Controls -->
<div class="controls">
  <div class="controls-group">
    <span class="controls-label">Heure</span>
    <button class="demo-btn" onclick="setTime('morning',this)">Matin</button>
    <button class="demo-btn" onclick="setTime('day',this)">Jour</button>
    <button class="demo-btn active" onclick="setTime('evening',this)">Soir</button>
    <button class="demo-btn" onclick="setTime('night',this)">Nuit</button>
  </div>
  <div class="controls-group">
    <span class="controls-label">Type</span>
    <button class="demo-btn active" onclick="setFanType('mixed',this)">Mixte</button>
    <button class="demo-btn" onclick="setFanType('standard',this)">Standard</button>
    <button class="demo-btn" onclick="setFanType('ceiling',this)">Plafond</button>
  </div>
  <div class="controls-group">
    <span class="controls-label">Etat</span>
    <button class="demo-btn" onclick="setGlobal('all-on',this)">Tout On</button>
    <button class="demo-btn active" onclick="setGlobal('partial',this)">Partiel</button>
    <button class="demo-btn" onclick="setGlobal('all-off',this)">Tout Off</button>
  </div>
  <div class="controls-group">
    <span class="controls-label">Layout</span>
    <button class="demo-btn active" onclick="setLayout('full',this)">Full</button>
    <button class="demo-btn" onclick="setLayout('compact',this)">Compact</button>
  </div>
</div>

<script>
/* ================================================================
   HA fan SUPPORTED FEATURES bitmask
   ================================================================ */
var F = {
  SET_SPEED: 1,
  OSCILLATE: 2,
  DIRECTION: 4,
  PRESET_MODE: 8,
  TURN_OFF: 16,
  TURN_ON: 32
};

function hasFeature(id, flag) {
  return (fanDefs[id].supported_features & flag) !== 0;
}

/* ================================================================
   FAN DEFINITIONS — matches HA model
   ================================================================ */
var fanDefs = {
  salon: {
    name: 'Ventilateur Salon',
    icon: 'mdi-fan',
    type: 'standard',
    supported_features: F.SET_SPEED | F.OSCILLATE | F.PRESET_MODE | F.TURN_ON | F.TURN_OFF,
    speed_count: 3,
    preset_modes: ['auto', 'eco', 'nuit'],
    has_light: false
  },
  chambre: {
    name: 'Plafonnier Chambre',
    icon: 'mdi-ceiling-fan',
    type: 'ceiling',
    supported_features: F.SET_SPEED | F.DIRECTION | F.PRESET_MODE | F.TURN_ON | F.TURN_OFF,
    speed_count: 6,
    preset_modes: ['confort', 'silence', 'turbo'],
    has_light: true
  },
  bureau: {
    name: 'Ventilateur Bureau',
    icon: 'mdi-fan',
    type: 'standard',
    supported_features: F.SET_SPEED | F.OSCILLATE | F.TURN_ON | F.TURN_OFF,
    speed_count: 4,
    preset_modes: [],
    has_light: false
  },
  cuisine: {
    name: 'Plafonnier Cuisine',
    icon: 'mdi-ceiling-fan',
    type: 'ceiling',
    supported_features: F.SET_SPEED | F.DIRECTION | F.TURN_ON | F.TURN_OFF,
    speed_count: 3,
    preset_modes: [],
    has_light: true
  },
  terrasse: {
    name: 'Ventilateur Terrasse Exterieure Grand Modele',
    icon: 'mdi-fan',
    type: 'standard',
    supported_features: F.SET_SPEED | F.OSCILLATE | F.PRESET_MODE | F.TURN_ON | F.TURN_OFF,
    speed_count: 3,
    preset_modes: ['eco', 'turbo'],
    has_light: false
  },
  sejour: {
    name: 'Plafonnier Sejour',
    icon: 'mdi-ceiling-fan',
    type: 'ceiling',
    supported_features: F.SET_SPEED | F.DIRECTION | F.PRESET_MODE | F.TURN_ON | F.TURN_OFF,
    speed_count: 4,
    preset_modes: ['confort', 'eco', 'nuit', 'silence'],
    has_light: true
  },
  sdb: {
    name: 'Extracteur SdB',
    icon: 'mdi-fan',
    type: 'standard',
    supported_features: F.SET_SPEED | F.TURN_ON | F.TURN_OFF,
    speed_count: 2,
    preset_modes: [],
    has_light: false
  }
};

/* State model — matches HA attributes:
   percentage (0-100), preset_mode, oscillating, direction */
var fans = {
  salon:    { on: true,  percentage: 67,  direction: 'forward', oscillating: true,  preset_mode: 'auto', light_on: false, light_brightness: 0 },
  chambre:  { on: false, percentage: 50,  direction: 'forward', oscillating: false, preset_mode: null,   light_on: true,  light_brightness: 70 },
  bureau:   { on: true,  percentage: 100, direction: 'forward', oscillating: false, preset_mode: null,   light_on: false, light_brightness: 0 },
  cuisine:  { on: true,  percentage: 33,  direction: 'reverse', oscillating: false, preset_mode: null,   light_on: true,  light_brightness: 45 },
  terrasse: { on: false, percentage: 33,  direction: 'forward', oscillating: false, preset_mode: null,   light_on: false, light_brightness: 0 },
  sejour:   { on: true,  percentage: 75,  direction: 'forward', oscillating: false, preset_mode: 'confort', light_on: true, light_brightness: 90 },
  sdb:      { on: true,  percentage: 100, direction: 'forward', oscillating: false, preset_mode: null,   light_on: false, light_brightness: 0 }
};

var activeFan = null;
var currentType = 'mixed';
var currentLayout = 'full';

/* percentage -> spin animation duration */
function spinDuration(pct) {
  if (pct <= 0) return '3s';
  if (pct <= 20) return '4s';
  if (pct <= 40) return '2.5s';
  if (pct <= 60) return '1.6s';
  if (pct <= 80) return '1.1s';
  return '0.7s';
}

/* percentage -> discrete step (1-based) */
function pctToStep(pct, speedCount) {
  if (pct <= 0) return 0;
  return Math.max(1, Math.min(speedCount, Math.round(pct / (100 / speedCount))));
}

/* discrete step -> percentage */
function stepToPct(step, speedCount) {
  if (step <= 0) return 0;
  return Math.round((step / speedCount) * 100);
}

/* percentage_step for a given fan */
function pctStep(id) {
  return 100 / fanDefs[id].speed_count;
}

/* Snap percentage to nearest valid step */
function snapPct(pct, speedCount) {
  var step = pctToStep(pct, speedCount);
  return stepToPct(step, speedCount);
}

var MODE_ICONS = {
  auto: 'mdi-autorenew',
  eco: 'mdi-leaf',
  nuit: 'mdi-weather-night',
  confort: 'mdi-sofa',
  silence: 'mdi-volume-off',
  turbo: 'mdi-lightning-bolt'
};

var MARQUEE_FULL = 18;
var MARQUEE_COMPACT = 10;

/* ================================================================
   SAFE DOM HELPERS
   ================================================================ */
function el(tag, cls, attrs) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (attrs) {
    var keys = Object.keys(attrs);
    for (var k = 0; k < keys.length; k++) {
      var key = keys[k];
      var val = attrs[key];
      if (key === 'text') e.textContent = val;
      else e.setAttribute(key, val);
    }
  }
  return e;
}

function mdi(name) {
  var i = document.createElement('i');
  i.className = 'mdi ' + name;
  return i;
}

/** DOM-safe marquee: returns text node or <span class="marquee"> */
function marqueeEl(text, maxChars) {
  if (maxChars === undefined) maxChars = MARQUEE_FULL;
  if (!text || text.length <= maxChars) {
    return document.createTextNode(text || '');
  }
  var span = document.createElement('span');
  span.className = 'marquee';
  span.textContent = text + '\u00A0\u00A0\u00A0' + text + '\u00A0\u00A0\u00A0';
  return span;
}

/* ================================================================
   RENDER
   ================================================================ */
function render() {
  var list = document.getElementById('fan-list');
  var wasActive = activeFan;
  activeFan = null;
  while (list.firstChild) list.removeChild(list.firstChild);

  var ids = Object.keys(fanDefs);
  var onCount = 0;
  var total = 0;
  var visibleIds = [];

  ids.forEach(function(id) {
    var def = fanDefs[id];
    if (currentType !== 'mixed' && def.type !== currentType) return;
    total++;
    if (fans[id].on) onCount++;
    visibleIds.push(id);
  });

  if (visibleIds.length === 0) {
    list.appendChild(el('div', 'empty-state', { text: 'Aucun ventilateur' }));
    updateHeader(0, 0);
    updateTint(0, 0);
    return;
  }

  if (currentLayout === 'compact') {
    renderCompactGrid(list, visibleIds, wasActive);
  } else {
    renderFullGrid(list, visibleIds, wasActive);
  }

  /* Header */
  updateHeader(onCount, total);
  updateTint(onCount, total);
}

/* ── Full layout: each fan takes full width ── */
function renderFullGrid(list, visibleIds, wasActive) {
  for (var idx = 0; idx < visibleIds.length; idx++) {
    var id = visibleIds[idx];
    var isOpen = wasActive === id;
    if (isOpen) activeFan = id;
    var isLast = idx + 1 >= visibleIds.length;

    renderFanRow(list, id, false, false, isOpen, isLast, wasActive);
  }
}

/* ── Compact layout: fans paired side-by-side ── */
function renderCompactGrid(list, visibleIds, wasActive) {
  var i = 0;
  while (i < visibleIds.length) {
    var left = visibleIds[i];
    var right = (i + 1 < visibleIds.length) ? visibleIds[i + 1] : null;

    if (right) {
      var isLast = (i + 2 >= visibleIds.length);
      var leftOpen = wasActive === left;
      var rightOpen = wasActive === right;
      if (leftOpen) activeFan = left;
      if (rightOpen) activeFan = right;

      /* Render both compact rows */
      renderFanRowCompact(list, left, false, leftOpen);
      renderFanRowCompact(list, right, true, rightOpen);

      /* Folds for both */
      renderControlFold(list, left, leftOpen, isLast, wasActive);
      renderControlFold(list, right, rightOpen, isLast, wasActive);

      i += 2;
    } else {
      var isOpen = wasActive === left;
      if (isOpen) activeFan = left;
      renderFanRow(list, left, false, false, isOpen, true, wasActive);
      i++;
    }
  }
}

/* ── Render a single full-width fan row + fold ── */
function renderFanRow(list, id, compact, isRight, isOpen, isLast, wasActive) {
  var def = fanDefs[id];
  var state = fans[id];

  var row = buildFanRowEl(id, def, state, compact, isRight);
  list.appendChild(row);

  renderControlFold(list, id, isOpen, isLast, wasActive);
}

/* ── Render a compact fan row (no fold attached) ── */
function renderFanRowCompact(list, id, isRight, isOpen) {
  var def = fanDefs[id];
  var state = fans[id];
  var row = buildFanRowEl(id, def, state, true, isRight);
  list.appendChild(row);
}

/* ── Build a fan row DOM element ── */
function buildFanRowEl(id, def, state, compact, isRight) {
  var classes = 'fan-row';
  if (state.on) classes += ' on';
  if (compact) classes += ' compact';
  if (isRight) classes += ' compact-right';

  var row = el('div', classes);
  row.setAttribute('data-id', id);

  var iconBtn = el('button', 'fan-icon-btn');
  iconBtn.setAttribute('aria-label', 'Basculer ' + def.name);
  var icon = mdi(def.icon);
  if (state.on) {
    icon.classList.add('spinning');
    if (state.direction === 'reverse') icon.classList.add('reverse');
    icon.style.setProperty('--spin-duration', spinDuration(state.percentage));
  }
  iconBtn.appendChild(icon);
  iconBtn.addEventListener('click', (function(fid) {
    return function(e) {
      e.stopPropagation();
      fans[fid].on = !fans[fid].on;
      if (!fans[fid].on) fans[fid].percentage = 0;
      render();
    };
  })(id));

  var expandBtn = el('button', 'fan-expand-btn');
  expandBtn.setAttribute('aria-expanded', String(activeFan === id));
  expandBtn.setAttribute('aria-controls', 'fold-' + id);
  expandBtn.setAttribute('aria-label', 'Controles ' + def.name);

  var info = el('div', 'fan-info');
  var nameEl = el('div', 'fan-name');
  nameEl.appendChild(marqueeEl(def.name, compact ? MARQUEE_COMPACT : MARQUEE_FULL));
  var sub = el('div', 'fan-sub');

  var speedText = el('span', 'fan-speed-text');
  if (state.on) {
    var step = pctToStep(state.percentage, def.speed_count);
    speedText.textContent = state.percentage + '% \u00B7 Vitesse ' + step + '/' + def.speed_count;
  } else {
    speedText.textContent = 'Eteint';
  }
  sub.appendChild(speedText);

  if (state.on && hasFeature(id, F.DIRECTION)) {
    var dirSpan = el('span', 'fan-direction');
    dirSpan.appendChild(mdi(state.direction === 'forward' ? 'mdi-rotate-right' : 'mdi-rotate-left'));
    var dirText = document.createTextNode(state.direction === 'forward' ? 'Ete' : 'Hiver');
    dirSpan.appendChild(dirText);
    sub.appendChild(dirSpan);
  }

  info.appendChild(nameEl);
  info.appendChild(sub);

  var dot = el('span', 'fan-dot');

  expandBtn.appendChild(info);
  expandBtn.appendChild(dot);

  expandBtn.addEventListener('click', (function(fid) {
    return function(e) {
      e.stopPropagation();
      activeFan = activeFan === fid ? null : fid;
      render();
    };
  })(id));

  row.appendChild(iconBtn);
  row.appendChild(expandBtn);

  return row;
}

/* ── Render control fold for a fan ── */
function renderControlFold(list, id, isOpen, isLast, wasActive) {
  var def = fanDefs[id];
  var state = fans[id];

  var fold = el('div', 'ctrl-fold');
  fold.id = 'fold-' + id;
  fold.setAttribute('role', 'region');
  fold.setAttribute('aria-hidden', String(!isOpen));
  var foldInner = el('div', 'ctrl-fold-inner');
  var panel = el('div', 'ctrl-panel');

  if (isOpen) {
    var label = el('span', 'ctrl-label', { text: def.name });
    panel.appendChild(label);

    if (hasFeature(id, F.SET_SPEED)) {
      renderSpeedSteps(panel, id, def, state);
      renderSpeedSlider(panel, id, def, state);
    }

    if (hasFeature(id, F.PRESET_MODE) && def.preset_modes.length > 0) {
      renderModes(panel, id, def, state);
    }

    if (hasFeature(id, F.DIRECTION)) {
      panel.appendChild(el('div', 'ctrl-sep'));
      renderDirection(panel, id, state);
    }

    if (hasFeature(id, F.OSCILLATE)) {
      renderOscillation(panel, id, state);
    }

    if (def.has_light) {
      panel.appendChild(el('div', 'ctrl-sep'));
      renderCeilingLight(panel, id, state);
    }
  }

  foldInner.appendChild(panel);
  fold.appendChild(foldInner);

  /* Top separator */
  var sepTop = el('div', 'fold-sep');
  list.appendChild(sepTop);
  list.appendChild(fold);

  /* Bottom separator (only if not last) */
  if (!isLast) {
    var sepBottom = el('div', 'fold-sep');
    list.appendChild(sepBottom);
  }

  if (isOpen) {
    if (wasActive === id) {
      fold.classList.add('open');
      sepTop.classList.add('visible');
      if (!isLast) sepBottom.classList.add('visible');
    } else {
      (function(f, st, sb) {
        requestAnimationFrame(function() { requestAnimationFrame(function() {
          f.classList.add('open');
          st.classList.add('visible');
          if (sb) sb.classList.add('visible');
        }); });
      })(fold, sepTop, isLast ? null : sepBottom);
    }
  }
}

/* ── Speed steps ── */
function renderSpeedSteps(panel, id, def, state) {
  var wrap = el('div', 'speed-steps');
  var currentStep = state.on ? pctToStep(state.percentage, def.speed_count) : 0;

  for (var s = 1; s <= def.speed_count; s++) {
    var btn = el('button', 'speed-step' + (currentStep === s ? ' active' : ''));
    var stepPct = stepToPct(s, def.speed_count);

    var numSpan = document.createElement('span');
    numSpan.textContent = String(s);
    btn.appendChild(numSpan);

    var pctSpan = el('span', 'speed-step-pct');
    pctSpan.textContent = stepPct + '%';
    btn.appendChild(pctSpan);

    btn.setAttribute('aria-label', 'Vitesse ' + s + ' (' + stepPct + '%)');
    btn.addEventListener('click', (function(fid, spd, pct) {
      return function(e) {
        e.stopPropagation();
        fans[fid].percentage = pct;
        if (!fans[fid].on) fans[fid].on = true;
        fans[fid].preset_mode = null;
        render();
      };
    })(id, s, stepPct));
    wrap.appendChild(btn);
  }
  panel.appendChild(wrap);
}

/* ── Speed slider (percentage, snaps to steps) ── */
function renderSpeedSlider(panel, id, def, state) {
  var pct = state.on ? state.percentage : 0;

  var wrap = el('div', 'slider-wrap');
  var iconLeft = el('div', 'slider-icon');
  iconLeft.appendChild(mdi('mdi-speedometer'));
  wrap.appendChild(iconLeft);

  var slider = el('div', 'slider');
  slider.setAttribute('data-fan', id);

  var fill = el('div', 'slider-fill accent');
  fill.style.width = pct + '%';
  var thumb = el('div', 'slider-thumb');
  thumb.style.left = pct + '%';
  var val = el('div', 'slider-val', { text: pct + '%' });

  slider.appendChild(fill);
  slider.appendChild(thumb);
  slider.appendChild(val);

  slider.addEventListener('pointerdown', function(e) { e.stopPropagation(); handleSlider(e, id, def); });
  slider.addEventListener('click', function(e) { e.stopPropagation(); });

  wrap.appendChild(slider);
  panel.appendChild(wrap);
}

function handleSlider(e, fanId, def) {
  var slider = e.currentTarget;
  slider.setPointerCapture(e.pointerId);

  function update(ev) {
    var rect = slider.getBoundingClientRect();
    var rawPct = Math.max(0, Math.min(100, Math.round(((ev.clientX - rect.left) / rect.width) * 100)));
    var snapped = snapPct(rawPct, def.speed_count);
    fans[fanId].percentage = snapped;
    if (!fans[fanId].on && snapped > 0) fans[fanId].on = true;
    if (snapped === 0) fans[fanId].on = false;
    fans[fanId].preset_mode = null;
    slider.querySelector('.slider-fill').style.width = snapped + '%';
    slider.querySelector('.slider-thumb').style.left = snapped + '%';
    slider.querySelector('.slider-val').textContent = snapped + '%';
  }

  update(e);
  slider.addEventListener('pointermove', update);
  slider.addEventListener('pointerup', function() {
    slider.removeEventListener('pointermove', update);
    render();
  }, { once: true });
}

/* ── Modes ── */
function renderModes(panel, id, def, state) {
  var row = el('div', 'mode-row');
  def.preset_modes.forEach(function(mode) {
    var chip = el('button', 'chip' + (state.on && state.preset_mode === mode ? ' active' : ''));
    chip.appendChild(mdi(MODE_ICONS[mode] || 'mdi-cog'));
    chip.appendChild(document.createTextNode(' ' + mode.charAt(0).toUpperCase() + mode.slice(1)));
    chip.setAttribute('aria-label', 'Mode ' + mode);
    chip.addEventListener('click', (function(fid, m) {
      return function(e) {
        e.stopPropagation();
        fans[fid].preset_mode = fans[fid].preset_mode === m ? null : m;
        render();
      };
    })(id, mode));
    row.appendChild(chip);
  });
  panel.appendChild(row);
}

/* ── Direction ── */
function renderDirection(panel, id, state) {
  var row = el('div', 'direction-row');
  var label = el('div', 'direction-label');
  label.appendChild(mdi('mdi-rotate-3d-variant'));
  label.appendChild(document.createTextNode('Direction'));

  var btns = el('div', 'direction-btns');

  var fwd = el('button', 'dir-btn' + (state.direction === 'forward' ? ' active' : ''));
  fwd.appendChild(mdi('mdi-rotate-right'));
  fwd.setAttribute('aria-label', 'Sens ete');
  fwd.addEventListener('click', (function(fid) {
    return function(e) { e.stopPropagation(); fans[fid].direction = 'forward'; render(); };
  })(id));

  var rev = el('button', 'dir-btn' + (state.direction === 'reverse' ? ' active' : ''));
  rev.appendChild(mdi('mdi-rotate-left'));
  rev.setAttribute('aria-label', 'Sens hiver');
  rev.addEventListener('click', (function(fid) {
    return function(e) { e.stopPropagation(); fans[fid].direction = 'reverse'; render(); };
  })(id));

  btns.appendChild(fwd);
  btns.appendChild(rev);
  row.appendChild(label);
  row.appendChild(btns);
  panel.appendChild(row);
}

/* ── Oscillation ── */
function renderOscillation(panel, id, state) {
  var row = el('div', 'osc-row');
  var label = el('div', 'osc-label');
  label.appendChild(mdi('mdi-arrow-left-right'));
  label.appendChild(document.createTextNode('Oscillation'));

  var toggle = el('button', 'toggle-sm' + (state.oscillating ? ' on' : ''));
  toggle.setAttribute('role', 'switch');
  toggle.setAttribute('aria-checked', String(state.oscillating));
  toggle.setAttribute('aria-label', 'Oscillation');
  toggle.addEventListener('click', (function(fid) {
    return function(e) { e.stopPropagation(); fans[fid].oscillating = !fans[fid].oscillating; render(); };
  })(id));

  row.appendChild(label);
  row.appendChild(toggle);
  panel.appendChild(row);
}

/* ── Ceiling light (separate HA entity, shown as UX convenience) ── */
function renderCeilingLight(panel, id, state) {
  var row = el('div', 'ceiling-light-row');
  var label = el('div', 'ceiling-light-label');
  label.appendChild(mdi('mdi-lightbulb-outline'));
  label.appendChild(document.createTextNode('Eclairage'));

  var toggle = el('button', 'toggle-sm' + (state.light_on ? ' on' : ''));
  toggle.setAttribute('role', 'switch');
  toggle.setAttribute('aria-checked', String(state.light_on));
  toggle.setAttribute('aria-label', 'Eclairage plafonnier');
  toggle.addEventListener('click', (function(fid) {
    return function(e) { e.stopPropagation(); fans[fid].light_on = !fans[fid].light_on; render(); };
  })(id));

  row.appendChild(label);
  row.appendChild(toggle);
  panel.appendChild(row);

  /* Brightness slider */
  if (state.light_on) {
    var pct = state.light_brightness;

    var wrap = el('div', 'slider-wrap');
    var iconLeft = el('div', 'slider-icon');
    iconLeft.appendChild(mdi('mdi-brightness-6'));
    wrap.appendChild(iconLeft);

    var slider = el('div', 'slider');
    var fill = el('div', 'slider-fill warm');
    fill.style.width = pct + '%';
    var thumb = el('div', 'slider-thumb');
    thumb.style.left = pct + '%';
    var val = el('div', 'slider-val', { text: pct + '%' });

    slider.appendChild(fill);
    slider.appendChild(thumb);
    slider.appendChild(val);

    slider.addEventListener('pointerdown', function(e) {
      var sl = e.currentTarget;
      sl.setPointerCapture(e.pointerId);
      function upd(ev) {
        var rect = sl.getBoundingClientRect();
        var p = Math.max(0, Math.min(100, Math.round(((ev.clientX - rect.left) / rect.width) * 100)));
        fans[id].light_brightness = p;
        sl.querySelector('.slider-fill').style.width = p + '%';
        sl.querySelector('.slider-thumb').style.left = p + '%';
        sl.querySelector('.slider-val').textContent = p + '%';
      }
      upd(e);
      sl.addEventListener('pointermove', upd);
      sl.addEventListener('pointerup', function() {
        sl.removeEventListener('pointermove', upd);
        render();
      }, { once: true });
    });

    wrap.appendChild(slider);
    panel.appendChild(wrap);
  }
}

/* ── Header ── */
function updateHeader(onCount, total) {
  var countEl = document.getElementById('card-count');
  countEl.textContent = onCount + '/' + total;
  if (onCount === 0) countEl.className = 'card-count none';
  else if (onCount === total) countEl.className = 'card-count all';
  else countEl.className = 'card-count some';

  var toggleEl = document.getElementById('toggle-all');
  toggleEl.className = 'toggle-all' + (onCount > 0 ? ' on' : '');
}

function updateTint(onCount, total) {
  var tint = document.getElementById('card-tint');
  if (total > 0 && onCount > 0) {
    var opacity = (onCount / total * 0.18).toFixed(3);
    tint.style.background = 'radial-gradient(ellipse at 30% 30%, #818cf8, transparent 70%)';
    tint.style.opacity = opacity;
  } else {
    tint.style.opacity = '0';
  }
}

/* ── Toggle all ── */
function toggleAll() {
  var anyOn = Object.keys(fans).some(function(id) {
    if (currentType !== 'mixed' && fanDefs[id].type !== currentType) return false;
    return fans[id].on;
  });
  Object.keys(fans).forEach(function(id) {
    if (currentType !== 'mixed' && fanDefs[id].type !== currentType) return;
    fans[id].on = !anyOn;
    if (!anyOn) {
      if (fans[id].percentage === 0) fans[id].percentage = stepToPct(1, fanDefs[id].speed_count);
    } else {
      fans[id].percentage = 0;
    }
  });
  render();
}

/* ── Demo controls ── */
function setTime(t, btn) {
  document.body.setAttribute('data-time', t);
  btn.parentElement.querySelectorAll('.demo-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}

function setFanType(type, btn) {
  currentType = type;
  activeFan = null;
  btn.parentElement.querySelectorAll('.demo-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

function setGlobal(state, btn) {
  btn.parentElement.querySelectorAll('.demo-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');

  if (state === 'all-on') {
    Object.keys(fans).forEach(function(id) {
      fans[id].on = true;
      if (fans[id].percentage === 0) fans[id].percentage = stepToPct(2, fanDefs[id].speed_count);
    });
  } else if (state === 'all-off') {
    Object.keys(fans).forEach(function(id) { fans[id].on = false; fans[id].percentage = 0; });
    activeFan = null;
  } else {
    var idx = 0;
    Object.keys(fans).forEach(function(id) {
      fans[id].on = idx % 2 === 0;
      if (fans[id].on) {
        var spd = Math.min(fanDefs[id].speed_count, 2 + idx);
        fans[id].percentage = stepToPct(spd, fanDefs[id].speed_count);
      } else {
        fans[id].percentage = 0;
      }
      idx++;
    });
    activeFan = null;
  }
  render();
}

function setLayout(layout, btn) {
  currentLayout = layout;
  activeFan = null;
  btn.parentElement.querySelectorAll('.demo-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

/* ── Init ── */
render();
</script>

</body>
