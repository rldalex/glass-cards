<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3548"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <!-- Pièces stylisées -->
  <rect x="20" y="20" width="120" height="80" fill="rgba(96,165,250,0.15)" stroke="rgba(96,165,250,0.35)" stroke-width="1.5" rx="4"/>
  <rect x="150" y="20" width="100" height="100" fill="rgba(96,165,250,0.15)" stroke="rgba(96,165,250,0.35)" stroke-width="1.5" rx="4"/>
  <rect x="260" y="20" width="120" height="80" fill="rgba(96,165,250,0.15)" stroke="rgba(96,165,250,0.35)" stroke-width="1.5" rx="4"/>
  <rect x="20" y="110" width="100" height="110" fill="rgba(96,165,250,0.15)" stroke="rgba(96,165,250,0.35)" stroke-width="1.5" rx="4"/>
  <rect x="130" y="130" width="150" height="90" fill="rgba(96,165,250,0.15)" stroke="rgba(96,165,250,0.35)" stroke-width="1.5" rx="4"/>
  <rect x="290" y="110" width="90" height="110" fill="rgba(96,165,250,0.15)" stroke="rgba(96,165,250,0.35)" stroke-width="1.5" rx="4"/>
  <!-- Position robot mock -->
  <circle cx="205" cy="175" r="6" fill="#4ade80" opacity="0.9"/>
  <circle cx="205" cy="175" r="12" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.4"/>
  <!-- Labels pièces (très light) -->
  <text x="80" y="65" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Cuisine</text>
  <text x="200" y="75" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Couloir</text>
  <text x="320" y="65" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Atelier</text>
  <text x="70" y="170" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">SdB</text>
  <text x="205" y="198" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Séjour</text>
  <text x="335" y="170" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Chambre</text>
